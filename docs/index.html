<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My-Stock-Screener | Quant &amp; Hedging Desk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#060a12; --s1:#0d1422; --s2:#131d30; --bd:#223454; --tx:#f8fafc; --mu:#94a3b8;
      --ac:#38bdf8; --bu:#10b981; --be:#f43f5e; --wa:#f59e0b;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      background:var(--bg); color:var(--tx); font-family:'Inter',system-ui,sans-serif;
      line-height:1.45; min-height:100vh;
    }
    .mono { font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }
    .pos { color:var(--bu); } .neg { color:var(--be); } .neu { color:var(--wa); } .mu { color:var(--mu); }
    .topbar {
      position:sticky; top:0; z-index:40; background:rgba(6,10,18,.94); backdrop-filter:blur(10px);
      border-bottom:1px solid var(--bd); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px;
      align-items:center; justify-content:space-between;
    }
    .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .chip {
      font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:999px;
      border:1px solid var(--bd); background:var(--s2); color:#cbd5e1;
    }
    .b-bu { background:rgba(16,185,129,.15); color:#6ee7b7; border-color:rgba(16,185,129,.45); }
    .b-be { background:rgba(244,63,94,.15); color:#fda4af; border-color:rgba(244,63,94,.45); }
    .b-wa { background:rgba(245,158,11,.15); color:#fde68a; border-color:rgba(245,158,11,.45); }
    select, input, button.btn {
      background:var(--s1); color:var(--tx); border:1px solid var(--bd); border-radius:8px;
      padding:6px 10px; font-size:.76rem; font-family:inherit; min-height:32px;
    }
    button.btn { cursor:pointer; font-weight:600; }
    button.btn-pri { background:#0284c7; border-color:#7dd3fc; color:#fff; }
    button.btn-run { background:#0d9488; border-color:#6ee7b7; color:#fff; }
    .wrap { max-width:1440px; margin:0 auto; padding:14px 16px 56px; }
    .banner, .panel, .kpi, .card, .ledger {
      background:var(--s1); border:1px solid var(--bd); border-radius:12px; padding:12px 14px;
    }
    .banner { margin-bottom:12px; display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; font-size:.76rem; }
    .dispatch { display:none; margin-bottom:12px; }
    .dispatch.open { display:block; }
    .d-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-top:8px; }
    .d-grid label { display:block; font-size:.66rem; font-weight:700; color:var(--mu); margin-bottom:3px; text-transform:uppercase; }
    .d-grid input, .d-grid select { width:100%; }
    .strip { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px; }
    .tile { min-width:165px; background:var(--s1); border:1px solid var(--bd); border-radius:10px; padding:8px 11px; flex-shrink:0; }
    .grid-4 { display:grid; grid-template-columns:repeat(auto-fit,minmax(195px,1fr)); gap:10px; margin-bottom:12px; }
    .grid-2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:10px; margin-bottom:12px; }
    .tabs { display:flex; flex-wrap:wrap; gap:6px; }
    .tab {
      padding:6px 10px; border-radius:8px; border:1px solid transparent; background:transparent;
      color:var(--mu); font-size:.75rem; font-weight:700; cursor:pointer;
    }
    .tab.active { background:rgba(56,189,248,.16); border-color:rgba(56,189,248,.5); color:#7dd3fc; }
    .sec-h { display:flex; justify-content:space-between; align-items:baseline; margin:16px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--bd); }
    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px; }
    .card { display:flex; flex-direction:column; gap:8px; }
    .lvls { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; background:#080d17; border:1px solid var(--bd); border-radius:8px; padding:7px; }
    .lvls span { display:block; font-size:.6rem; color:var(--mu); text-transform:uppercase; }
    .lvls strong { display:block; font-size:.82rem; margin-top:2px; }
    .kv { display:grid; grid-template-columns:1fr 1fr; gap:4px 8px; font-size:.72rem; color:var(--mu); background:var(--s2); border-radius:8px; padding:7px 9px; }
    .kv strong { color:var(--tx); }
    .rat { font-size:.74rem; color:#cbd5e1; background:var(--s2); border-left:3px solid var(--ac); border-radius:7px; padding:7px 9px; }
    .t-wrap { overflow-x:auto; border:1px solid var(--bd); border-radius:10px; background:var(--s1); max-height:480px; }
    table { width:100%; border-collapse:collapse; font-size:.74rem; }
    th, td { padding:6px 8px; border-bottom:1px solid rgba(34,52,84,.6); white-space:nowrap; }
    th { position:sticky; top:0; background:#090f1b; color:var(--mu); text-align:left; }
    th.r, td.r { text-align:right; } th.c, td.c { text-align:center; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
    .dchip { background:var(--s2); border:1px solid var(--bd); border-radius:7px; padding:3px 8px; font-size:.72rem; }
    .warn-box { margin-top:10px; padding:9px 11px; border-radius:8px; background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.35); font-size:.74rem; color:#fde68a; }
    .empty { background:var(--s1); border:1px dashed var(--bd); border-radius:10px; padding:22px; text-align:center; color:var(--mu); }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="row">
        <strong id="bTitle" style="font-size:.96rem;">My-Stock-Screener</strong>
        <span class="chip mono b-bu" id="bMode">MODE</span>
        <span class="chip mono" id="bFresh">CHECKING</span>
      </div>
      <div class="mu" id="bSub" style="font-size:.71rem; margin-top:2px;">Loading snapshot...</div>
    </div>
    <div class="row">
      <div class="row">
        <button type="button" class="tab active" id="btnLatest">LATEST</button>
        <button type="button" class="tab" id="btnMorning" disabled>MORNING</button>
        <button type="button" class="tab" id="btnBtst" disabled>BTST</button>
      </div>
      <div class="row">
        <button type="button" class="tab active" id="vCards">Cards</button>
        <button type="button" class="tab" id="vTable">Table</button>
      </div>
      <select id="histSel"><option value="data/latest.json">Latest Snapshot</option></select>
      <button type="button" class="btn btn-pri" id="btnSync">Refresh</button>
      <button type="button" class="btn" id="btnAuto">Auto: 15s</button>
      <button type="button" class="btn btn-run" id="btnRunToggle">Refresh &amp; Run</button>
    </div>
  </header>

  <main class="wrap">
    <section class="banner" id="bannerBox"></section>

    <section class="panel dispatch" id="dispatchBox">
      <div class="row" style="justify-content:space-between;">
        <strong style="font-size:.82rem;">GitHub Workflow Dispatch (Local Browser Storage Only)</strong>
        <button type="button" class="btn" id="btnClearCfg">Clear Config</button>
      </div>
      <div class="d-grid">
        <div><label>Owner</label><input type="text" id="ghOwner" placeholder="Yashraj306" /></div>
        <div><label>Repo</label><input type="text" id="ghRepo" placeholder="My-Stock-Screener" /></div>
        <div><label>Workflow</label><input type="text" id="ghWf" value="screener.yml" /></div>
        <div><label>Ref</label><input type="text" id="ghRef" value="main" /></div>
        <div><label>Mode</label><select id="ghMode"><option value="MORNING">MORNING</option><option value="BTST">BTST</option></select></div>
        <div><label>PAT (Local)</label><input type="password" id="ghPat" placeholder="github_pat_..." /></div>
      </div>
      <div class="row" style="justify-content:space-between; margin-top:10px;">
        <div class="row">
          <button type="button" class="btn btn-run" id="btnTrigger">Trigger &amp; Poll</button>
          <button type="button" class="btn" id="btnSaveCfg">Save Local</button>
        </div>
        <span class="mono mu" id="dStatus" style="font-size:.72rem;">Ready.</span>
      </div>
    </section>

    <nav class="strip" id="histPills"></nav>
    <section class="strip" id="tickerBox"></nav>
    <section class="grid-4" id="kpiBox"></section>
    <section class="grid-2" id="ctxBox"></section>

    <section class="panel" id="filterBox" style="margin-bottom:12px;">
      <div class="row" style="justify-content:space-between;">
        <div class="tabs" id="tabBar">
          <button type="button" class="tab active" data-t="ALL">All</button>
          <button type="button" class="tab" data-t="IDX">Index</button>
          <button type="button" class="tab" data-t="OBULL">Opt Bullish</button>
          <button type="button" class="tab" data-t="OBEAR">Opt Bearish</button>
          <button type="button" class="tab" data-t="EQ">Equity Intraday</button>
          <button type="button" class="tab" data-t="OI">Option Chain / OI</button>
        </div>
        <div class="row">
          <select id="secSel"><option value="ALL">All Sectors</option></select>
          <input type="search" id="symSearch" placeholder="Search symbol..." />
          <button type="button" class="btn" id="btnReset">Reset</button>
        </div>
      </div>
    </section>

    <div id="workBox"></div>
    <section class="ledger" id="ledgerBox" style="margin-top:16px;"></section>
  </main>

  <script>
    const KEY = "mss_gh_dispatch_v1";
    const IST_MS = 330 * 60 * 1000;
    const st = {
      data: null, snaps: [], tab: "ALL", view: "CARDS",
      file: "data/latest.json", date: null, chainSym: null,
      auto: true, pTimer: null, dTimer: null, lastGen: null, err: null
    };

    const setH = (id, h) => { const e = document.getElementById(id); if (e) e.innerHTML = h; };
    const esc = (v) => v == null ? "" : String(v).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
    const num = (v, d = null) => {
      if (v == null || v === "") return "—";
      const n = Number(v);
      return (Number.isFinite(n) && d != null) ? n.toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d }) : esc(v);
    };
    const intF = (v) => { const n = Number(v); return Number.isFinite(n) ? n.toLocaleString("en-IN") : "—"; };
    const chgF = (v) => {
      if (v == null || v === "") return "—";
      const s = String(v).trim();
      if (s.endsWith("%")) return s;
      const n = Number(s);
      return Number.isFinite(n) ? `${n >= 0 ? "+" : ""}${n.toFixed(2)}%` : esc(s);
    };
    const clsF = (v) => {
      const s = String(v ?? "");
      if (s.includes("-")) return "neg";
      const n = parseFloat(s.replace("%", ""));
      return Number.isFinite(n) ? (n > 0 ? "pos" : (n < 0 ? "neg" : "mu")) : "mu";
    };

    async function getJson(url) {
      const ac = new AbortController();
      const tm = setTimeout(() => ac.abort(), 10000);
      try {
        const r = await fetch(`${url}${url.includes("?") ? "&" : "?"}_t=${Date.now()}`, { cache: "no-store", signal: ac.signal });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return await r.json();
      } finally { clearTimeout(tm); }
    }

    function istInfo() {
      const d = new Date(Date.now() + IST_MS);
      const day = d.getUTCDay();
      const mins = d.getUTCHours() * 60 + d.getUTCMinutes();
      const open = day >= 1 && day <= 5 && mins >= 555 && mins <= 930;
      return { open, nowStr: d.toISOString().replace("T", " ").slice(0, 19) + " IST" };
    }

    function ageMins(genStr) {
      if (!genStr) return null;
      const m = String(genStr).trim().match(/^(\d{4}-\d{2}-\d{2})[T\s](\d{2}):(\d{2}):(\d{2})/);
      if (!m) return null;
      const [, ymd, hh, mm, ss] = m;
      const [y, mo, d] = ymd.split("-").map(Number);
      const actualUtc = Date.UTC(y, mo - 1, d, Number(hh), Number(mm), Number(ss)) - IST_MS;
      const diff = Math.round((Date.now() - actualUtc) / 60000);
      return Number.isFinite(diff) ? diff : null;
    }

    function allInst(p) {
      if (!p) return [];
      const seen = new Set(), out = [];
      const lists = [
        p.index_trades, p.options_bullish, p.setups && p.setups.bullish,
        p.options_bearish, p.setups && p.setups.bearish, p.equity_intraday
      ];
      for (const a of lists) {
        if (!Array.isArray(a)) continue;
        for (const x of a) {
          if (!x || !x.symbol) continue;
          const k = String(x.symbol).toUpperCase();
          if (!seen.has(k)) { seen.add(k); out.push(x); }
        }
      }
      return out;
    }

    function modeFile(dt, mName) {
      const u = String(mName || "").toUpperCase();
      if (dt) {
        const hit = st.snaps.find(s => s.date === dt && String(s.mode || "").toUpperCase() === u);
        if (hit) return hit.file;
      }
      const fb = st.snaps.find(s => String(s.mode || "").toUpperCase() === u);
      return fb ? fb.file : null;
    }

    function syncModes() {
      const mFile = modeFile(st.date, "MORNING");
      const bFile = modeFile(st.date, "BTST");
      const bL = document.getElementById("btnLatest");
      const bM = document.getElementById("btnMorning");
      const bB = document.getElementById("btnBtst");
      if (bL) bL.classList.toggle("active", st.file === "data/latest.json");
      if (bM) { bM.disabled = !mFile; bM.classList.toggle("active", Boolean(mFile && st.file === mFile)); }
      if (bB) { bB.disabled = !bFile; bB.classList.toggle("active", Boolean(bFile && st.file === bFile)); }
    }

    async function loadMan() {
      try {
        const m = await getJson("data/manifest.json");
        st.snaps = Array.isArray(m.snapshots) ? m.snapshots : [];
        const sel = document.getElementById("histSel");
        const pills = document.getElementById("histPills");
        if (!sel || !pills) return;
        const cur = st.file;
        sel.innerHTML = `<option value="data/latest.json">Latest Snapshot</option>`;
        pills.innerHTML = `<button type="button" class="chip ${cur === "data/latest.json" ? "b-bu" : ""}" data-f="data/latest.json" style="cursor:pointer;">Latest</button>`;
        const seen = new Set();
        for (const s of st.snaps) {
          const o = document.createElement("option");
          o.value = s.file;
          o.textContent = `${s.date} [${s.mode || "RUN"}] (${s.ideas_count ?? 0})`;
          sel.appendChild(o);
          if (s.date && !seen.has(s.date) && seen.size < 12) {
            seen.add(s.date);
            const b = document.createElement("button");
            b.type = "button";
            b.className = `chip ${st.date === s.date && cur !== "data/latest.json" ? "b-bu" : ""}`;
            b.style.cursor = "pointer";
            b.textContent = `${s.date} (${s.ideas_count ?? 0})`;
            b.onclick = () => pickSnap(s.file, s.date);
            pills.appendChild(b);
          }
        }
        const lp = pills.querySelector('[data-f="data/latest.json"]');
        if (lp) lp.onclick = () => pickSnap("data/latest.json", null);
        sel.value = Array.from(sel.options).some(x => x.value === cur) ? cur : "data/latest.json";
      } catch (_) {}
    }

    async function pickSnap(f, dt = null, quiet = false) {
      st.file = f;
      if (dt !== null) st.date = dt;
      else if (f === "data/latest.json") st.date = null;
      else { const hit = st.snaps.find(s => s.file === f); if (hit) st.date = hit.date; }
      const sel = document.getElementById("histSel");
      if (sel) sel.value = f;
      await loadSnap(f, quiet);
    }

    async function loadSnap(f, quiet = false) {
      const b = document.getElementById("btnSync");
      if (!quiet && b) b.textContent = "Syncing...";
      try {
        const d = await getJson(f);
        st.data = d; st.err = null;
        if (!st.date && d.session_date) st.date = d.session_date;
        st.lastGen = d.generated_at_ist || null;
      } catch (e) {
        st.err = e.message || String(e);
      } finally {
        if (!quiet && b) b.textContent = "Refresh";
        render(); syncModes();
      }
    }

    function filt(arr) {
      const q = (document.getElementById("symSearch")?.value || "").trim().toUpperCase();
      const sec = document.getElementById("secSel")?.value || "ALL";
      return (Array.isArray(arr) ? arr : []).filter(x => x &&
        (!q || String(x.symbol || "").toUpperCase().includes(q)) &&
        (sec === "ALL" || String(x.sector || "") === sec));
    }

    function cardHtml(it, bkt) {
      const bull = /BULL|BUY/i.test(String(it.side || it.action || ""));
      const plan = (it.option_plan && (it.option_plan.strategy_name || it.option_plan.summary)) || it.equity_bucket || "Execution Plan";
      const rng = Number(it.avg_range_rs) > 0 ? `₹${Number(it.avg_range_rs).toFixed(1)}` : "—";
      return `
        <article class="card">
          <div class="row" style="justify-content:space-between; align-items:flex-start;">
            <div>
              <div class="mono" style="font-size:1rem; font-weight:800;">${esc(it.symbol)} <span class="${clsF(it.change_pct)}" style="font-size:.8rem;">${chgF(it.change_pct)}</span></div>
              <div class="row mu" style="font-size:.69rem; margin-top:2px;">
                <span class="chip">${esc(it.sector || "EQ")}</span>
                <span class="chip">${esc(bkt)}</span>
                <span>AvgRng: <strong class="mono">${esc(rng)}</strong></span>
              </div>
            </div>
            <span class="chip mono ${bull ? "b-bu" : "b-be"}">${esc(it.side || "SETUP")}</span>
          </div>
          <div class="lvls mono">
            <div><span>Entry</span><strong>${num(it.entry)}</strong></div>
            <div><span>SL</span><strong class="neg">${num(it.stop_loss)}</strong></div>
            <div><span>Tgt 1</span><strong class="pos">${num(it.target_1)}</strong></div>
            <div><span>Tgt 2</span><strong class="pos">${num(it.target_2)}</strong></div>
          </div>
          <div class="kv">
            <div>Zone: <strong class="mono">${num(it.best_entry_low)}–${num(it.best_entry_high)}</strong></div>
            <div>VWAP/OI: <strong class="mono">${num(it.vwap)}/${num(it.oi_target)}</strong></div>
            <div>Qty: <strong class="mono">${num(it.qty)}</strong></div>
            <div>Sizing: <strong class="mono">${esc(it.sizing_status || "Std")}</strong></div>
            <div style="grid-column:1/-1;">Plan: <strong>${esc(plan)}</strong></div>
          </div>
          <div class="rat">${esc(it.why_trade || it.entry_action || "Technical & OI setup.")}</div>
          <button type="button" class="btn" onclick="openChain('${esc(String(it.symbol || "").toUpperCase())}')">Inspect Option Chain (${esc(it.symbol)})</button>
        </article>`;
    }

    function tblHtml(items, bkt) {
      const trs = items.map(it => {
        const bull = /BULL|BUY/i.test(String(it.side || it.action || ""));
        const rng = Number(it.avg_range_rs) > 0 ? `₹${Number(it.avg_range_rs).toFixed(1)}` : "—";
        return `<tr class="mono">
          <td><strong>${esc(it.symbol)}</strong> <span class="mu">(${esc(it.sector || "EQ")})</span></td>
          <td><span class="chip ${bull ? "b-bu" : "b-be"}">${esc(it.side || bkt)}</span></td>
          <td class="r ${clsF(it.change_pct)}">${chgF(it.change_pct)}</td>
          <td class="r">${num(it.entry)}</td>
          <td class="r neg">${num(it.stop_loss)}</td>
          <td class="r pos">${num(it.target_1)}</td>
          <td class="r pos">${num(it.target_2)}</td>
          <td class="r">${num(it.oi_target)}</td>
          <td class="r">${esc(rng)}</td>
          <td class="r">${num(it.qty)}</td>
          <td><button type="button" class="btn" style="padding:2px 7px; min-height:24px;" onclick="openChain('${esc(String(it.symbol || "").toUpperCase())}')">OI</button></td>
        </tr>`;
      }).join("");
      return `<div class="t-wrap"><table><thead><tr>
        <th>Symbol</th><th>Side</th><th class="r">Chg%</th><th class="r">Entry</th><th class="r">SL</th>
        <th class="r">Tgt 1</th><th class="r">Tgt 2</th><th class="r">OI Tgt</th><th class="r">AvgRng</th><th class="r">Qty</th><th>Chain</th>
      </tr></thead><tbody>${trs}</tbody></table></div>`;
    }

    function oiHtml(p) {
      const all = allInst(p);
      if (!all.length) return `<div class="empty">No instruments available for Option Chain view.</div>`;
      const sel = all.find(x => String(x.symbol).toUpperCase() === String(st.chainSym).toUpperCase()) || all[0];
      const cs = sel.chain_summary || {}, ca = sel.chain_analytics || {};
      const rows = Array.isArray(sel.option_chain) ? sel.option_chain : [];
      const opts = all.map(x => {
        const k = String(x.symbol).toUpperCase();
        return `<option value="${esc(k)}" ${k === String(sel.symbol).toUpperCase() ? "selected" : ""}>${esc(k)} (${esc(x.sector || "EQ")})</option>`;
      }).join("");

      const body = rows.length ? `<div class="t-wrap"><table><thead><tr>
        <th class="r">CE OI</th><th class="r">CE Chg</th><th class="r">CE LTP</th><th class="c">Strike</th>
        <th class="r">PE LTP</th><th class="r">PE Chg</th><th class="r">PE OI</th><th class="c">Zone</th><th>Note</th>
      </tr></thead><tbody>${rows.map(r => {
        const z = String(r.zone_role || "");
        const zc = z === "STRONG_SUPPORT" ? "b-bu" : (z === "STRONG_RESISTANCE" ? "b-be" : (z ? "b-wa" : ""));
        return `<tr class="mono">
          <td class="r">${intF(r.ce_oi)}</td>
          <td class="r ${clsF(r.ce_chg_oi)}">${intF(r.ce_chg_oi)} (${chgF(r.ce_chg_pct)})</td>
          <td class="r">${num(r.ce_ltp)}</td>
          <td class="c"><strong>${num(r.strike)}</strong>${r.is_atm ? " ATM" : ""}</td>
          <td class="r">${num(r.pe_ltp)}</td>
          <td class="r ${clsF(r.pe_chg_oi)}">${intF(r.pe_chg_oi)} (${chgF(r.pe_chg_pct)})</td>
          <td class="r">${intF(r.pe_oi)}</td>
          <td class="c">${z ? `<span class="chip ${zc}">${esc(z)}</span>` : "—"}</td>
          <td>${esc(r.impact_note || "")}</td>
        </tr>`;
      }).join("")}</tbody></table></div>`
      : `<div class="empty">Strike rows not present for <strong>${esc(sel.symbol)}</strong> in this snapshot.</div>`;

      return `<div class="panel">
        <div class="row" style="justify-content:space-between; margin-bottom:10px;">
          <div><strong>Option Chain &amp; OI Structure</strong> <span class="mu" style="font-size:.72rem;">(Snapshot data, not tick streaming)</span></div>
          <select id="oiPick">${opts}</select>
        </div>
        <div class="kv" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); margin-bottom:10px;">
          <div>Spot: <strong class="mono">${num(sel.spot ?? sel.entry)}</strong></div>
          <div>Expiry / PCR: <strong class="mono">${num(sel.option_expiry || cs.expiry)} / ${num(cs.pcr)}</strong></div>
          <div>OI / Pain: <strong class="mono">${num(cs.oi_build_up)} / ${num(cs.max_pain)}</strong></div>
          <div>EOS / EOR: <strong class="mono">${num(ca.eos)} / ${num(ca.eor)}</strong></div>
        </div>
        ${body}
      </div>`;
    }

    function openChain(sym) {
      st.chainSym = sym; st.tab = "OI";
      document.querySelectorAll("#tabBar .tab").forEach(b => b.classList.toggle("active", b.dataset.t === "OI"));
      render();
      document.getElementById("filterBox")?.scrollIntoView({ behavior: "smooth" });
    }

    function render() {
      const inf = istInfo(), p = st.data;
      if (st.err && !p) {
        setH("bannerBox", `<div><strong class="neg">Load Error:</strong> ${esc(st.err)}</div><div class="mono mu">${esc(inf.nowStr)}</div>`);
        return;
      }
      const age = ageMins(p && p.generated_at_ist);
      const stale = age != null && age > 180;
      const fBadge = stale ? `<span class="chip mono b-be">STALE (${age}m)</span>`
        : (age != null ? `<span class="chip mono b-bu">${age <= 30 ? "RECENT" : "SNAP"} (${age}m)</span>` : `<span class="chip mono">SNAP</span>`);
      setH("bFresh", fBadge);
      setH("bannerBox", `
        <div><strong>${inf.open ? "Market Hours (Batch Sync)" : "Market Closed / Snapshot Data"}:</strong> Batch JSON snapshot (not tick-by-tick live feed).</div>
        <div class="mono mu">Gen: ${esc(p?.generated_at_ist || "—")} • Now: ${esc(inf.nowStr)}</div>
      `);
      if (!p) return;

      const s = p.summary || {}, mStr = String(p.mode || "RUN").toUpperCase();
      const mb = document.getElementById("bMode");
      if (mb) { mb.textContent = mStr; mb.className = `chip mono ${mStr === "BTST" ? "b-wa" : "b-bu"}`; }
      const bt = document.getElementById("bTitle"); if (bt) bt.textContent = p.title || "My-Stock-Screener";
      const bs = document.getElementById("bSub"); if (bs) bs.textContent = `Date: ${p.session_date || "—"} • Source: ${s.data_source || "—"}`;

      const items = allInst(p);
      const secs = Array.from(new Set(items.map(x => x.sector).filter(Boolean))).sort();
      const secSel = document.getElementById("secSel");
      if (secSel) {
        const prev = secSel.value;
        secSel.innerHTML = `<option value="ALL">All Sectors (${secs.length})</option>` + secs.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join("");
        if (secs.includes(prev)) secSel.value = prev;
      }
      if (!st.chainSym || !items.some(x => x.symbol === st.chainSym)) {
        st.chainSym = items.some(x => String(x.symbol).toUpperCase() === "NIFTY") ? "NIFTY" : (items[0]?.symbol || null);
      }

      const idxT = Array.isArray(p.index_trades) ? p.index_trades : [];
      const oBu = Array.isArray(p.options_bullish) ? p.options_bullish : (p.setups?.bullish || []);
      const oBe = Array.isArray(p.options_bearish) ? p.options_bearish : (p.setups?.bearish || []);
      const eqI = Array.isArray(p.equity_intraday) ? p.equity_intraday : [];

      const tList = [
        { k: "NIFTY 50", v: s.nifty_spot, c: s.nifty_chg },
        { k: "BANK NIFTY", v: s.bnf_spot, c: s.bnf_chg },
        { k: "FIN NIFTY", v: s.fin_spot, c: s.fin_chg },
        { k: "BREADTH", v: s.breadth_tone || "MIXED", c: s.breadth_ratio || "—" },
      ];
      const sx = idxT.find(x => String(x.symbol).toUpperCase() === "SENSEX");
      if (sx) tList.splice(3, 0, { k: "SENSEX", v: sx.spot ?? sx.entry, c: sx.change_pct });
      setH("tickerBox", tList.map(t => `<div class="tile"><div class="row mono" style="justify-content:space-between; font-size:.7rem;"><span>${esc(t.k)}</span><span class="${clsF(t.c)}">${esc(chgF(t.c))}</span></div><div class="mono" style="font-size:.95rem; font-weight:800; margin-top:3px;">${num(t.v)}</div></div>`).join(""));

      setH("kpiBox", `
        <div class="kpi"><div class="mu" style="font-size:.66rem; font-weight:700;">TOTAL IDEAS</div><div class="mono" style="font-size:1.25rem; font-weight:800;">${num(s.ideas_count)}</div><div class="mono mu" style="font-size:.7rem;">${idxT.length} Idx • ${oBu.length + oBe.length} Opt • ${eqI.length} Eq</div></div>
        <div class="kpi"><div class="mu" style="font-size:.66rem; font-weight:700;">OPTIONS</div><div class="mono" style="font-size:1.25rem; font-weight:800;">${oBu.length + oBe.length}</div><div class="mono mu" style="font-size:.7rem;">${oBu.length} Bull / ${oBe.length} Bear</div></div>
        <div class="kpi"><div class="mu" style="font-size:.66rem; font-weight:700;">EQUITY INTRADAY</div><div class="mono" style="font-size:1.25rem; font-weight:800;">${eqI.length}</div><div class="mu" style="font-size:.7rem;">Zero overlap w/ stock options</div></div>
        <div class="kpi"><div class="mu" style="font-size:.66rem; font-weight:700;">BREADTH</div><div class="mono ${clsF(s.breadth_tone === "BULLISH" ? 1 : (s.breadth_tone === "BEARISH" ? -1 : 0))}" style="font-size:1.25rem; font-weight:800;">${esc(s.breadth_tone || "MIXED")}</div><div class="mono mu" style="font-size:.7rem;">${esc(s.breadth_ratio || "—")}</div></div>
      `);

      const cues = Array.isArray(p.global_cues) ? p.global_cues : [];
      const secArr = Array.isArray(p.sectors) ? p.sectors : Object.entries(p.sectors || {}).map(([k, v]) => (typeof v === "object" && v ? { sector: k, ...v } : { sector: k, score: v }));
      setH("ctxBox", `
        <div class="panel"><strong style="font-size:.72rem;">GLOBAL CUES</strong><div class="chips">${cues.length ? cues.slice(0, 8).map(c => `<span class="dchip mono">${esc(c.name || c.symbol || "Cue")} <strong>${num(c.price ?? c.value)}</strong> <span class="${clsF(c.change_pct ?? c.change)}">${chgF(c.change_pct ?? c.change)}</span></span>`).join("") : `<span class="mu" style="font-size:.72rem;">None</span>`}</div></div>
        <div class="panel"><strong style="font-size:.72rem;">SECTOR STRENGTH</strong><div class="chips">${secArr.length ? secArr.slice(0, 12).map(sc => { const m = sc.avg_change_pct ?? sc.score; return `<span class="dchip mono">${esc(sc.sector || sc.name || "SEC")} <strong class="${clsF(m)}">${m != null ? (sc.avg_change_pct != null ? chgF(m) : num(m)) : "—"}</strong></span>`; }).join("") : `<span class="mu" style="font-size:.72rem;">None</span>`}</div></div>
      `);

      if (st.tab === "OI") {
        setH("workBox", oiHtml(p));
        const pk = document.getElementById("oiPick");
        if (pk) pk.onchange = (e) => { st.chainSym = e.target.value; render(); };
      } else {
        const secsCfg = [
          { t: "IDX", title: "Index Trades", b: "INDEX", list: filt(idxT) },
          { t: "OBULL", title: "Options — Bullish", b: "OPT BULL", list: filt(oBu) },
          { t: "OBEAR", title: "Options — Bearish", b: "OPT BEAR", list: filt(oBe) },
          { t: "EQ", title: "Equity Intraday", b: "EQ INTRA", list: filt(eqI) },
        ].filter(x => st.tab === "ALL" || st.tab === x.t);

        let out = "";
        for (const sc of secsCfg) {
          if (!sc.list.length) continue;
          const body = st.view === "TABLE" ? tblHtml(sc.list, sc.b) : `<div class="cards">${sc.list.map(it => cardHtml(it, sc.b)).join("")}</div>`;
          out += `<div class="sec-h"><strong>${esc(sc.title)}</strong><span class="mono mu" style="font-size:.73rem;">${sc.list.length}</span></div>${body}`;
        }
        setH("workBox", out || `<div class="empty">No matching setups. <button type="button" class="btn" onclick="resetF()">Reset</button></div>`);
      }

      const wf = p.walk_forward || {};
      const nClosed = Number(wf.closed_trades ?? 0);
      const small = !Number.isFinite(nClosed) || nClosed < 30;
      const wr = wf.net_win_rate_pct != null ? `${num(wf.net_win_rate_pct)}% (Post-Cost)` : "N/A";
      setH("ledgerBox", `
        <div class="row" style="justify-content:space-between;">
          <strong>Risk &amp; Post-Cost Walk-Forward Ledger</strong>
          <span class="chip mono ${small ? "b-wa" : "b-bu"}">n = ${esc(wf.closed_trades ?? 0)}</span>
        </div>
        <div class="kv mono" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); margin-top:8px;">
          <div>Closed Trades: <strong>${num(wf.closed_trades ?? 0)}</strong></div>
          <div>Net Win Rate: <strong>${esc(wr)}</strong></div>
          <div>Est. Costs: <strong>₹${num(wf.total_costs ?? wf.total_est_charges ?? 0)}</strong></div>
          <div>Total Net P&amp;L: <strong>₹${num(wf.total_net_pnl ?? 0)}</strong></div>
          <div>Max Net DD: <strong>₹${num(wf.max_drawdown_net_pnl ?? 0)}</strong></div>
        </div>
        <div class="warn-box"><strong>Notice:</strong> ${small ? `Small sample (n = ${esc(wf.closed_trades ?? 0)} &lt; 30); early metrics are not guaranteed performance.` : esc(wf.sample_warning || "Post-cost historical log.")} Research &amp; risk tool only.</div>
      `);
    }

    function resetF() {
      st.tab = "ALL";
      const ss = document.getElementById("symSearch"); if (ss) ss.value = "";
      const sc = document.getElementById("secSel"); if (sc) sc.value = "ALL";
      document.querySelectorAll("#tabBar .tab").forEach(b => b.classList.toggle("active", b.dataset.t === "ALL"));
      render();
    }

    function loadCfg() {
      try {
        const c = JSON.parse(localStorage.getItem(KEY) || "{}");
        if (c.owner) document.getElementById("ghOwner").value = c.owner;
        if (c.repo) document.getElementById("ghRepo").value = c.repo;
        if (c.wf) document.getElementById("ghWf").value = c.wf;
        if (c.ref) document.getElementById("ghRef").value = c.ref;
        if (c.mode) document.getElementById("ghMode").value = c.mode;
        if (c.pat) document.getElementById("ghPat").value = c.pat;
      } catch (_) {}
    }

    function saveCfg() {
      const c = {
        owner: document.getElementById("ghOwner").value.trim(),
        repo: document.getElementById("ghRepo").value.trim(),
        wf: document.getElementById("ghWf").value.trim() || "screener.yml",
        ref: document.getElementById("ghRef").value.trim() || "main",
        mode: document.getElementById("ghMode").value,
        pat: document.getElementById("ghPat").value.trim(),
      };
      localStorage.setItem(KEY, JSON.stringify(c));
      return c;
    }

    async function runDispatch() {
      const c = saveCfg();
      if (!c.owner || !c.repo || !c.wf || !c.pat) {
        setH("dStatus", "Enter Owner, Repo, Workflow, and local PAT.");
        return;
      }
      setH("dStatus", "Dispatching...");
      try {
        const u = `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/actions/workflows/${encodeURIComponent(c.wf)}/dispatches`;
        const r = await fetch(u, {
          method: "POST",
          headers: { "Authorization": `Bearer ${c.pat}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
          body: JSON.stringify({ ref: c.ref || "main", inputs: { mode: c.mode } })
        });
        if (r.status !== 204 && !r.ok) throw new Error(`HTTP ${r.status}`);
        setH("dStatus", `Dispatched (${esc(c.mode)}). Polling every 10s...`);
        const prev = st.lastGen; let n = 0;
        if (st.dTimer) clearInterval(st.dTimer);
        st.dTimer = setInterval(async () => {
          n += 1; await loadMan(); await loadSnap("data/latest.json", true);
          if (st.data?.generated_at_ist && st.data.generated_at_ist !== prev) {
            clearInterval(st.dTimer); setH("dStatus", `Updated: ${esc(st.data.generated_at_ist)}`);
          } else if (n >= 24) {
            clearInterval(st.dTimer); setH("dStatus", "Polling stopped (4m). Click Refresh.");
          } else {
            setH("dStatus", `Polling... (${n * 10}s)`);
          }
        }, 10000);
      } catch (e) { setH("dStatus", `Err: ${esc(e.message)}`); }
    }

    document.getElementById("btnLatest")?.addEventListener("click", () => pickSnap("data/latest.json", null));
    document.getElementById("btnMorning")?.addEventListener("click", () => { const f = modeFile(st.date, "MORNING"); if (f) pickSnap(f); });
    document.getElementById("btnBtst")?.addEventListener("click", () => { const f = modeFile(st.date, "BTST"); if (f) pickSnap(f); });
    document.getElementById("vCards")?.addEventListener("click", () => { st.view = "CARDS"; document.getElementById("vCards")?.classList.add("active"); document.getElementById("vTable")?.classList.remove("active"); render(); });
    document.getElementById("vTable")?.addEventListener("click", () => { st.view = "TABLE"; document.getElementById("vTable")?.classList.add("active"); document.getElementById("vCards")?.classList.remove("active"); render(); });
    document.getElementById("histSel")?.addEventListener("change", (e) => pickSnap(e.target.value));
    document.getElementById("btnSync")?.addEventListener("click", async () => { await loadMan(); await loadSnap(st.file, false); });
    document.getElementById("btnAuto")?.addEventListener("click", (e) => { st.auto = !st.auto; e.target.textContent = st.auto ? "Auto: 15s" : "Auto: Off"; });
    document.getElementById("btnRunToggle")?.addEventListener("click", () => document.getElementById("dispatchBox")?.classList.toggle("open"));
    document.getElementById("btnSaveCfg")?.addEventListener("click", () => { saveCfg(); setH("dStatus", "Saved locally."); });
    document.getElementById("btnClearCfg")?.addEventListener("click", () => { localStorage.removeItem(KEY); document.getElementById("ghPat").value = ""; setH("dStatus", "Cleared."); });
    document.getElementById("btnTrigger")?.addEventListener("click", runDispatch);
    document.querySelectorAll("#tabBar .tab").forEach(b => b.addEventListener("click", () => {
      document.querySelectorAll("#tabBar .tab").forEach(x => x.classList.remove("active"));
      b.classList.add("active"); st.tab = b.dataset.t; render();
    }));
    document.getElementById("symSearch")?.addEventListener("input", render);
    document.getElementById("secSel")?.addEventListener("change", render);
    document.getElementById("btnReset")?.addEventListener("click", resetF);

    (async () => {
      loadCfg(); await loadMan(); await loadSnap(st.file, false);
      st.pTimer = setInterval(() => { if (st.auto) loadSnap(st.file, true); }, 15000);
    })();
  </script>
</body>
</html>
