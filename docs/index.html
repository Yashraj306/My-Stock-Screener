<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quant &amp; Hedging Desk — Institutional Screener Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-2: #172033;
      --border: #1f2d47;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --bull: #10b981;
      --bull-bg: rgba(16, 185, 129, 0.12);
      --bear: #f43f5e;
      --bear-bg: rgba(244, 63, 94, 0.12);
      --warn: #f59e0b;
      --warn-bg: rgba(245, 158, 11, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top right, #111d35 0%, var(--bg) 45%);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    .mono { font-family: 'JetBrains Mono', monospace; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(12px);
      background: rgba(9, 13, 22, 0.86);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-dot {
      width: 11px; height: 11px; border-radius: 50%;
      background: var(--bull);
      box-shadow: 0 0 12px var(--bull);
    }
    .brand h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.2px; }
    .brand small { display: block; color: var(--muted); font-size: 0.76rem; }

    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

    select, input[type="search"], button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: all 0.18s ease;
    }
    select:hover, input[type="search"]:hover, button:hover {
      border-color: var(--accent);
    }
    button.primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border-color: #38bdf8;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button.primary:active { transform: scale(0.98); }

    .container { max-width: 1380px; margin: 0 auto; padding: 22px 24px 48px; }

    .history-ribbon {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 18px;
    }
    .pill {
      white-space: nowrap;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: 0.15s;
    }
    .pill.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: var(--text);
      font-weight: 600;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }
    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px 17px;
    }
    .kpi-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); }
    .kpi-val { font-size: 1.35rem; font-weight: 700; margin-top: 4px; }
    .kpi-sub { font-size: 0.8rem; margin-top: 3px; color: var(--muted); }

    .pos { color: var(--bull); }
    .neg { color: var(--bear); }
    .neu { color: var(--warn); }

    .filter-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .tab {
      padding: 6px 13px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
    }
    .tab.active {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--accent);
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin: 22px 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #e2e8f0;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }

    .card {
      background: linear-gradient(180deg, var(--surface) 0%, #0d1422 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.16s ease, border-color 0.16s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: #334b75; }

    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .sym { font-size: 1.12rem; font-weight: 700; }
    .sector-tag { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    .badge {
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 0.73rem;
      font-weight: 700;
      letter-spacing: 0.4px;
    }
    .badge-bull { background: var(--bull-bg); color: var(--bull); border: 1px solid rgba(16,185,129,0.3); }
    .badge-bear { background: var(--bear-bg); color: var(--bear); border: 1px solid rgba(244,63,94,0.3); }
    .badge-warn { background: var(--warn-bg); color: var(--warn); border: 1px solid rgba(245,158,11,0.3); }

    .levels {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
    }
    .lvl span { display: block; font-size: 0.68rem; color: var(--muted); text-transform: uppercase; }
    .lvl strong { font-size: 0.88rem; }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .rationale {
      font-size: 0.8rem;
      color: #cbd5e1;
      background: rgba(30, 41, 59, 0.45);
      padding: 9px 11px;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }

    .opt-box {
      font-size: 0.78rem;
      background: rgba(56, 189, 248, 0.06);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      padding: 8px 10px;
      color: #bae6fd;
    }

    .empty-box {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 36px;
      text-align: center;
      color: var(--muted);
    }

    .wf-banner {
      margin-top: 26px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 0.83rem;
    }

    @media (max-width: 640px) {
      .cards-grid { grid-template-columns: 1fr; }
      .levels { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-dot" id="statusDot"></div>
      <div>
        <h1 id="deskTitle">Quant &amp; Hedging Desk</h1>
        <small id="lastUpdated">Loading latest market snapshot...</small>
      </div>
    </div>

    <div class="controls">
      <select id="historySelect" title="Select Historical Session">
        <option value="data/latest.json">Latest Run (Fresh)</option>
      </select>
      <button class="primary" id="refreshBtn" type="button">↻ Refresh Data</button>
    </div>
  </header>

  <main class="container">
    <div class="history-ribbon" id="historyPills"></div>

    <section class="kpi-grid" id="kpiGrid"></section>

    <section class="filter-bar">
      <div class="tabs" id="categoryTabs">
        <button class="tab active" data-tab="ALL">All Setups</button>
        <button class="tab" data-tab="INDEX">Index Ideas</button>
        <button class="tab" data-tab="OPT_BULL">Options Bullish</button>
        <button class="tab" data-tab="OPT_BEAR">Options Bearish</button>
        <button class="tab" data-tab="EQ_INTRA">Equity Intraday</button>
      </div>
      <div class="controls">
        <select id="sectorFilter">
          <option value="ALL">All Sectors</option>
        </select>
        <input type="search" id="searchInput" placeholder="Search symbol (e.g. RELIANCE)..." />
      </div>
    </section>

    <div id="contentArea"></div>

    <section class="wf-banner" id="wfBanner"></section>
  </main>

  <script>
    let currentPayload = null;
    let activeTab = 'ALL';
    let selectedFile = 'data/latest.json';

    const fmtNum = (v) => (v === null || v === undefined || v === '') ? '—' : v;
    const chgClass = (txt) => {
      const s = String(txt || '');
      if (s.includes('-')) return 'neg';
      if (s.includes('+') || parseFloat(s) > 0) return 'pos';
      return 'neu';
    };

    async function fetchJsonNoCache(url) {
      const sep = url.includes('?') ? '&' : '?';
      const res = await fetch(`${url}${sep}_ts=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    async function loadManifest() {
      try {
        const manifest = await fetchJsonNoCache('data/manifest.json');
        const snapshots = manifest.snapshots || [];
        const sel = document.getElementById('historySelect');
        const pills = document.getElementById('historyPills');

        sel.innerHTML = `<option value="data/latest.json">Latest Run (Fresh)</option>`;
        pills.innerHTML = `<button class="pill ${selectedFile === 'data/latest.json' ? 'active' : ''}" data-file="data/latest.json">● Latest</button>`;

        const seenDates = new Set();
        snapshots.forEach((snap) => {
          const opt = document.createElement('option');
          opt.value = snap.file;
          opt.textContent = `${snap.date} [${snap.mode}] — ${snap.ideas_count} Ideas (${snap.breadth_tone})`;
          sel.appendChild(opt);

          if (!seenDates.has(snap.date) && seenDates.size < 12) {
            seenDates.add(snap.date);
            const btn = document.createElement('button');
            btn.className = `pill ${selectedFile === snap.file ? 'active' : ''}`;
            btn.dataset.file = snap.file;
            btn.textContent = `${snap.date} (${snap.ideas_count})`;
            btn.onclick = () => switchSnapshot(snap.file);
            pills.appendChild(btn);
          }
        });

        pills.querySelector('[data-file="data/latest.json"]').onclick = () => switchSnapshot('data/latest.json');
        sel.value = selectedFile;
      } catch (e) {
        console.warn('Manifest not ready yet:', e);
      }
    }

    async function switchSnapshot(filePath) {
      selectedFile = filePath;
      document.getElementById('historySelect').value = filePath;
      document.querySelectorAll('.pill').forEach(p => {
        p.classList.toggle('active', p.dataset.file === filePath);
      });
      await loadSnapshot(filePath);
    }

    async function loadSnapshot(filePath) {
      const btn = document.getElementById('refreshBtn');
      btn.textContent = '↻ Refreshing...';
      try {
        const data = await fetchJsonNoCache(filePath);
        currentPayload = data;
        renderDashboard(data);
      } catch (err) {
        document.getElementById('contentArea').innerHTML = `
          <div class="empty-box">
            <h3>Data snapshot not found yet (${filePath})</h3>
            <p style="margin-top:6px;">Run the GitHub Actions screener workflow once to generate <code>docs/data/latest.json</code> and daily history archives.</p>
          </div>`;
      } finally {
        btn.textContent = '↻ Refresh Data';
      }
    }

    function populateSectors(payload) {
      const allItems = [
        ...(payload.index_trades || []),
        ...(payload.options_bullish || []),
        ...(payload.options_bearish || []),
        ...(payload.equity_intraday || []),
      ];
      const sectors = Array.from(new Set(allItems.map(x => x.sector).filter(Boolean))).sort();
      const sel = document.getElementById('sectorFilter');
      const prev = sel.value;
      sel.innerHTML = `<option value="ALL">All Sectors</option>` +
        sectors.map(s => `<option value="${s}">${s}</option>`).join('');
      if (sectors.includes(prev)) sel.value = prev;
    }

    function renderCard(item, tagLabel) {
      const isBull = String(item.side || '').toUpperCase().includes('BULL') || String(item.action || '').toUpperCase().includes('BUY');
      const badgeCls = isBull ? 'badge-bull' : 'badge-bear';
      const opt = item.option_plan || {};
      const optHtml = opt.available
        ? `<div class="opt-box mono"><strong>Option Plan:</strong> ${opt.strategy || 'Spread/Directional'} | Strike: ${fmtNum(opt.strike || opt.buy_strike)} | Lot: ${fmtNum(opt.lot_size)} | Max Loss/Lot: ₹${fmtNum(opt.max_loss_lot)}</div>`
        : '';

      const oiHtml = item.oi_target ? `<span>OI Target: <strong class="mono">${item.oi_target}</strong></span>` : '';
      const vwapHtml = item.vwap ? `<span>VWAP: <strong class="mono">${item.vwap}</strong></span>` : '';

      return `
        <article class="card">
          <div class="card-head">
            <div>
              <div class="sym mono">${item.symbol} <span class="${chgClass(item.change_pct)}" style="font-size:0.85rem;">(${item.change_pct >= 0 ? '+' : ''}${fmtNum(item.change_pct)}%)</span></div>
              <div class="sector-tag">${item.sector || 'EQUITY'} • ${tagLabel} • Score: <strong class="mono">${fmtNum(item.score)}</strong></div>
            </div>
            <span class="badge ${badgeCls}">${item.side || 'SETUP'}</span>
          </div>

          <div class="levels mono">
            <div class="lvl"><span>Entry</span><strong>${fmtNum(item.entry)}</strong></div>
            <div class="lvl"><span>Stop Loss</span><strong class="neg">${fmtNum(item.stop_loss)}</strong></div>
            <div class="lvl"><span>Target 1</span><strong class="pos">${fmtNum(item.target_1)}</strong></div>
            <div class="lvl"><span>Target 2</span><strong class="pos">${fmtNum(item.target_2)}</strong></div>
          </div>

          <div class="meta-row">
            <span>Best Zone: <strong class="mono">${fmtNum(item.best_entry_low)}–${fmtNum(item.best_entry_high)}</strong></span>
            ${vwapHtml}
            ${oiHtml}
            <span>Qty: <strong class="mono">${fmtNum(item.qty)}</strong></span>
          </div>

          ${optHtml}
          <div class="rationale">${item.why_trade || item.entry_action || 'Systematic technical & relative strength alignment.'}</div>
        </article>`;
    }

    function renderDashboard(data) {
      const s = data.summary || {};
      document.getElementById('deskTitle').textContent = `${data.title || 'Quant & Hedging Desk'} [${data.mode || 'LIVE'}]`;
      document.getElementById('lastUpdated').textContent =
        `Session: ${data.session_date || '—'} • Generated: ${data.generated_at_ist || '—'} • Feed: ${s.data_source || '—'}`;

      const tone = String(s.breadth_tone || 'MIXED').toUpperCase();
      document.getElementById('statusDot').style.background = tone === 'BULLISH' ? 'var(--bull)' : (tone === 'BEARISH' ? 'var(--bear)' : 'var(--warn)');

      document.getElementById('kpiGrid').innerHTML = `
        <div class="kpi">
          <div class="kpi-label">NIFTY 50</div>
          <div class="kpi-val mono">${fmtNum(s.nifty_spot)}</div>
          <div class="kpi-sub mono ${chgClass(s.nifty_chg)}">${fmtNum(s.nifty_chg)}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">BANK NIFTY</div>
          <div class="kpi-val mono">${fmtNum(s.bnf_spot)}</div>
          <div class="kpi-sub mono ${chgClass(s.bnf_chg)}">${fmtNum(s.bnf_chg)}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">FIN NIFTY</div>
          <div class="kpi-val mono">${fmtNum(s.fin_spot)}</div>
          <div class="kpi-sub mono ${chgClass(s.fin_chg)}">${fmtNum(s.fin_chg)}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Market Breadth</div>
          <div class="kpi-val ${tone === 'BULLISH' ? 'pos' : (tone === 'BEARISH' ? 'neg' : 'neu')}">${tone}</div>
          <div class="kpi-sub mono">${fmtNum(s.breadth_ratio)} • &gt;EMA20: ${fmtNum(s.above_ema20)}%</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Active Ideas</div>
          <div class="kpi-val mono">${fmtNum(s.ideas_count)}</div>
          <div class="kpi-sub">Stock Setups: ${fmtNum(s.stock_setups_count)}</div>
        </div>
      `;

      populateSectors(data);

      const q = document.getElementById('searchInput').value.trim().toUpperCase();
      const sec = document.getElementById('sectorFilter').value;
      const filterFn = (arr) => (arr || []).filter(item => {
        const matchSym = !q || String(item.symbol || '').toUpperCase().includes(q);
        const matchSec = sec === 'ALL' || String(item.sector || '') === sec;
        return matchSym && matchSec;
      });

      const sections = [
        { key: 'INDEX', title: 'Index Option & Hedging Ideas', tag: 'INDEX', items: filterFn(data.index_trades) },
        { key: 'OPT_BULL', title: 'Options Bullish Candidates (Top 5)', tag: 'OPT BULL', items: filterFn(data.options_bullish || (data.setups || {}).bullish) },
        { key: 'OPT_BEAR', title: 'Options Bearish Candidates (Top 5)', tag: 'OPT BEAR', items: filterFn(data.options_bearish || (data.setups || {}).bearish) },
        { key: 'EQ_INTRA', title: 'Equity Intraday / Swing Setups', tag: 'EQUITY', items: filterFn(data.equity_intraday) },
      ].filter(secObj => activeTab === 'ALL' || activeTab === secObj.key);

      let html = '';
      sections.forEach(secObj => {
        if (!secObj.items.length) return;
        html += `
          <div class="section-title">
            <span>${secObj.title}</span>
            <span class="mono" style="font-size:0.8rem; color:var(--muted);">${secObj.items.length} setups</span>
          </div>
          <div class="cards-grid">${secObj.items.map(i => renderCard(i, secObj.tag)).join('')}</div>`;
      });

      document.getElementById('contentArea').innerHTML = html || `<div class="empty-box">No setups match the selected filter/date criteria.</div>`;

      const wf = data.walk_forward || {};
      document.getElementById('wfBanner').innerHTML = `
        <div>
          <strong>Walk-Forward Ledger:</strong> Closed Trades: <span class="mono">${fmtNum(wf.closed_trades)}</span> •
          Win Rate: <span class="mono">${wf.net_win_rate_pct !== null && wf.net_win_rate_pct !== undefined ? wf.net_win_rate_pct + '%' : 'N/A'}</span> •
          Net P&amp;L: <span class="mono">₹${fmtNum(wf.total_net_pnl)}</span>
        </div>
        <div style="color:var(--warn); font-size:0.78rem;">${wf.sample_warning || ''}</div>
      `;
    }

    document.getElementById('historySelect').addEventListener('change', (e) => switchSnapshot(e.target.value));
    document.getElementById('refreshBtn').addEventListener('click', async () => {
      await loadManifest();
      await loadSnapshot(selectedFile);
    });
    document.getElementById('searchInput').addEventListener('input', () => currentPayload && renderDashboard(currentPayload));
    document.getElementById('sectorFilter').addEventListener('change', () => currentPayload && renderDashboard(currentPayload));
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        if (currentPayload) renderDashboard(currentPayload);
      });
    });

    (async () => {
      await loadManifest();
      await loadSnapshot(selectedFile);
    })();
  </script>
</body>
</html>
