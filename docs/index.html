<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quant &amp; Hedging Desk — Live Option Chain &amp; Screener Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-2: #172033;
      --border: #1f2d47;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --bull: #10b981;
      --bull-bg: rgba(16, 185, 129, 0.14);
      --bear: #f43f5e;
      --bear-bg: rgba(244, 63, 94, 0.14);
      --warn: #f59e0b;
      --warn-bg: rgba(245, 158, 11, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top right, #111d35 0%, var(--bg) 45%);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    .mono { font-family: 'JetBrains Mono', monospace; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(12px);
      background: rgba(9, 13, 22, 0.9);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-dot {
      width: 11px; height: 11px; border-radius: 50%;
      background: var(--bull);
      box-shadow: 0 0 12px var(--bull);
    }
    .brand h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.2px; }
    .brand small { display: block; color: var(--muted); font-size: 0.76rem; }

    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

    .mode-switcher {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 4px;
    }
    .mode-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .mode-btn:hover:not(:disabled) { color: var(--text); border-color: var(--border); }
    .mode-btn.active-morning { background: rgba(56, 189, 248, 0.18); border-color: #38bdf8; color: #7dd3fc; }
    .mode-btn.active-btst { background: rgba(245, 158, 11, 0.18); border-color: #f59e0b; color: #fcd34d; }
    .mode-btn.active-latest { background: rgba(16, 185, 129, 0.18); border-color: #10b981; color: #6ee7b7; }
    .mode-btn:disabled { opacity: 0.38; cursor: not-allowed; }

    select, input[type="search"], button.ghost-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.84rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    select:hover, input[type="search"]:hover, button.ghost-btn:hover { border-color: var(--accent); }
    button.ghost-btn.live-on {
      border-color: var(--bull);
      background: rgba(16, 185, 129, 0.12);
      color: #6ee7b7;
      font-weight: 600;
    }

    button.primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: 1px solid #38bdf8;
      color: #fff;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .container { max-width: 1420px; margin: 0 auto; padding: 20px 24px 54px; }

    .history-ribbon {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    .pill {
      white-space: nowrap;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }
    .pill.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: var(--text);
      font-weight: 600;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(205px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .kpi-label { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); }
    .kpi-val { font-size: 1.32rem; font-weight: 700; margin-top: 4px; }
    .kpi-sub { font-size: 0.78rem; margin-top: 3px; color: var(--muted); }

    .pos { color: var(--bull); }
    .neg { color: var(--bear); }
    .neu { color: var(--warn); }

    .filter-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .tab {
      padding: 6px 13px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
    }
    .tab.active {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--accent);
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 22px 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #e2e8f0;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(365px, 1fr));
      gap: 16px;
    }

    .card {
      background: linear-gradient(180deg, var(--surface) 0%, #0d1422 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .sym { font-size: 1.12rem; font-weight: 700; }
    .sector-tag { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    .badge {
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .badge-bull { background: var(--bull-bg); color: var(--bull); border: 1px solid rgba(16,185,129,0.35); }
    .badge-bear { background: var(--bear-bg); color: var(--bear); border: 1px solid rgba(244,63,94,0.35); }

    .levels {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
    }
    .lvl span { display: block; font-size: 0.68rem; color: var(--muted); text-transform: uppercase; }
    .lvl strong { font-size: 0.88rem; }

    .meta-row { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 0.78rem; color: var(--muted); }
    .rationale {
      font-size: 0.8rem;
      color: #cbd5e1;
      background: rgba(30, 41, 59, 0.45);
      padding: 9px 11px;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }

    .chain-open-btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: rgba(56, 189, 248, 0.08);
      color: #7dd3fc;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    .chain-open-btn:hover { background: rgba(56, 189, 248, 0.18); }

    /* Live Option Chain Drawer / Panel */
    .oc-panel {
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid #2b3f63;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .oc-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .legend-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 0.76rem;
    }
    .box-pill {
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
    }
    .box-strong-sup { background: var(--bull-bg); color: #6ee7b7; border: 2px solid var(--bull); }
    .box-strong-res { background: var(--bear-bg); color: #fda4af; border: 2px solid var(--bear); }
    .box-weak-sr { background: var(--warn-bg); color: #fde68a; border: 2px solid var(--warn); }

    .table-wrap { overflow-x: auto; max-height: 460px; overflow-y: auto; border-radius: 10px; border: 1px solid var(--border); }
    table.oc-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    table.oc-table th {
      position: sticky;
      top: 0;
      background: #0d1424;
      color: var(--muted);
      font-weight: 700;
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      text-align: right;
      z-index: 2;
    }
    table.oc-table th.center, table.oc-table td.center { text-align: center; }
    table.oc-table td {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(31, 45, 71, 0.6);
      text-align: right;
      vertical-align: middle;
    }
    tr.atm-row { background: rgba(56, 189, 248, 0.08); }

    .cell-box-green {
      background: var(--bull-bg) !important;
      border: 2px solid var(--bull) !important;
      color: #a7f3d0 !important;
      font-weight: 700;
      border-radius: 6px;
    }
    .cell-box-red {
      background: var(--bear-bg) !important;
      border: 2px solid var(--bear) !important;
      color: #fecdd3 !important;
      font-weight: 700;
      border-radius: 6px;
    }
    .cell-box-yellow {
      background: var(--warn-bg) !important;
      border: 2px solid var(--warn) !important;
      color: #fef08a !important;
      font-weight: 700;
      border-radius: 6px;
    }

    .impact-col { text-align: left !important; min-width: 240px; font-size: 0.75rem; color: #cbd5e1; }
    .empty-box { background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; padding: 36px; text-align: center; color: var(--muted); }
    .wf-banner {
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 0.83rem;
    }

    @media (max-width: 640px) {
      .cards-grid { grid-template-columns: 1fr; }
      .levels { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-dot" id="statusDot"></div>
      <div>
        <h1 id="deskTitle">Quant &amp; Hedging Desk</h1>
        <small id="lastUpdated">Loading latest market snapshot...</small>
      </div>
    </div>

    <div class="controls">
      <div class="mode-switcher" role="group" aria-label="Screener Mode Switcher">
        <button type="button" class="mode-btn" id="btnLatest">LATEST</button>
        <button type="button" class="mode-btn" id="btnMorning">☀ MORNING</button>
        <button type="button" class="mode-btn" id="btnBtst">🌙 BTST</button>
      </div>

      <button type="button" class="ghost-btn live-on" id="liveTickBtn" title="Toggle Live Tick Polling">● LIVE TICK (10s)</button>

      <select id="historySelect" title="Select Historical Session">
        <option value="data/latest.json">Latest Run (Fresh)</option>
      </select>

      <button class="primary" id="refreshBtn" type="button">↻ Refresh Data</button>
    </div>
  </header>

  <main class="container">
    <div class="history-ribbon" id="historyPills"></div>

    <section class="kpi-grid" id="kpiGrid"></section>

    <section class="filter-bar">
      <div class="tabs" id="categoryTabs">
        <button class="tab active" data-tab="ALL">All Setups</button>
        <button class="tab" data-tab="INDEX">Index Ideas</button>
        <button class="tab" data-tab="OPT_BULL">Options Bullish</button>
        <button class="tab" data-tab="OPT_BEAR">Options Bearish</button>
        <button class="tab" data-tab="EQ_INTRA">Equity Intraday</button>
      </div>
      <div class="controls">
        <select id="sectorFilter">
          <option value="ALL">All Sectors</option>
        </select>
        <input type="search" id="searchInput" placeholder="Search symbol (e.g. NIFTY, RELIANCE)..." />
      </div>
    </section>

    <div id="contentArea"></div>

    <section class="oc-panel" id="optionChainPanel">
      <div class="oc-header">
        <div>
          <h2 id="ocTitle" style="font-size:1.05rem;">Live Option Chain — Select an Index or Stock</h2>
          <small id="ocMeta" style="color:var(--muted);">OI Change, Contracts Added, % Change &amp; Support/Resistance Impact</small>
        </div>
        <div class="controls">
          <select id="ocSymbolSelect" title="Select Symbol for Live Option Chain"></select>
          <span class="mono" id="ocTickClock" style="font-size:0.78rem; color:var(--accent);">Tick: —</span>
        </div>
      </div>

      <div class="legend-strip">
        <span class="box-pill box-strong-sup">🟢 Strong Support (Green Box)</span>
        <span class="box-pill box-strong-res">🔴 Strong Resistance (Red Box)</span>
        <span class="box-pill box-weak-sr">🟡 Weak Support / Weak Resistance &amp; Shift (Yellow Box)</span>
      </div>

      <div id="ocBody"></div>
    </section>

    <section class="wf-banner" id="wfBanner"></section>
  </main>

  <script>
    let currentPayload = null;
    let allSnapshots = [];
    let activeTab = 'ALL';
    let selectedFile = 'data/latest.json';
    let selectedDate = null;
    let selectedChainSymbol = null;
    let liveTickEnabled = true;
    let tickTimer = null;

    const fmtNum = (v) => (v === null || v === undefined || v === '') ? '—' : v;
    const fmtInt = (v) => {
      const n = Number(v);
      return Number.isFinite(n) ? n.toLocaleString('en-IN') : '—';
    };
    const chgClass = (txt) => {
      const s = String(txt || '');
      if (s.includes('-')) return 'neg';
      if (s.includes('+') || parseFloat(s) > 0) return 'pos';
      return 'neu';
    };

    async function fetchJsonNoCache(url) {
      const sep = url.includes('?') ? '&' : '?';
      const res = await fetch(`${url}${sep}_ts=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function getAllSetups(payload) {
      if (!payload) return [];
      return [
        ...(payload.index_trades || []),
        ...(payload.options_bullish || (payload.setups || {}).bullish || []),
        ...(payload.options_bearish || (payload.setups || {}).bearish || []),
        ...(payload.equity_intraday || []),
      ];
    }

    function findModeFileForDate(targetDate, targetMode) {
      const mUpper = targetMode.toUpperCase();
      if (targetDate) {
        const exact = allSnapshots.find(
          (s) => s.date === targetDate && String(s.mode || '').toUpperCase() === mUpper
        );
        if (exact) return exact.file;
      }
      const latestOfMode = allSnapshots.find(
        (s) => String(s.mode || '').toUpperCase() === mUpper
      );
      return latestOfMode ? latestOfMode.file : null;
    }

    function updateModeButtons(activeModeRaw) {
      const activeMode = String(activeModeRaw || '').toUpperCase();
      const btnLatest = document.getElementById('btnLatest');
      const btnMorning = document.getElementById('btnMorning');
      const btnBtst = document.getElementById('btnBtst');

      const morningFile = findModeFileForDate(selectedDate, 'MORNING');
      const btstFile = findModeFileForDate(selectedDate, 'BTST');

      btnMorning.disabled = !morningFile;
      btnBtst.disabled = !btstFile;

      btnLatest.className = 'mode-btn' + (selectedFile === 'data/latest.json' ? ' active-latest' : '');
      btnMorning.className = 'mode-btn' + (activeMode === 'MORNING' && selectedFile !== 'data/latest.json' ? ' active-morning' : '');
      btnBtst.className = 'mode-btn' + (activeMode === 'BTST' && selectedFile !== 'data/latest.json' ? ' active-btst' : '');

      if (selectedFile === 'data/latest.json') {
        if (activeMode === 'MORNING') btnMorning.classList.add('active-morning');
        if (activeMode === 'BTST') btnBtst.classList.add('active-btst');
      }
    }

    async function loadManifest() {
      try {
        const manifest = await fetchJsonNoCache('data/manifest.json');
        allSnapshots = manifest.snapshots || [];
        const sel = document.getElementById('historySelect');
        const pills = document.getElementById('historyPills');

        sel.innerHTML = `<option value="data/latest.json">Latest Run (Fresh)</option>`;
        pills.innerHTML = `<button class="pill ${selectedFile === 'data/latest.json' ? 'active' : ''}" data-file="data/latest.json">● Latest</button>`;

        const seenDates = new Set();
        allSnapshots.forEach((snap) => {
          const opt = document.createElement('option');
          opt.value = snap.file;
          opt.textContent = `${snap.date} [${snap.mode}] — ${snap.ideas_count} Ideas (${snap.breadth_tone})`;
          sel.appendChild(opt);

          if (!seenDates.has(snap.date) && seenDates.size < 12) {
            seenDates.add(snap.date);
            const btn = document.createElement('button');
            btn.className = `pill ${selectedFile === snap.file ? 'active' : ''}`;
            btn.dataset.file = snap.file;
            btn.dataset.date = snap.date;
            btn.textContent = `${snap.date} (${snap.ideas_count})`;
            btn.onclick = () => switchSnapshot(snap.file, snap.date);
            pills.appendChild(btn);
          }
        });

        pills.querySelector('[data-file="data/latest.json"]').onclick = () => switchSnapshot('data/latest.json', null);
        sel.value = selectedFile;
      } catch (e) {
        console.warn('Manifest not ready yet:', e);
      }
    }

    async function switchSnapshot(filePath, dateOverride = null) {
      selectedFile = filePath;
      if (dateOverride !== null) {
        selectedDate = dateOverride;
      } else if (filePath === 'data/latest.json') {
        selectedDate = null;
      } else {
        const found = allSnapshots.find((s) => s.file === filePath);
        if (found) selectedDate = found.date;
      }

      document.getElementById('historySelect').value = filePath;
      document.querySelectorAll('.pill').forEach(p => {
        const isMatch = p.dataset.file === filePath || (selectedDate && p.dataset.date === selectedDate);
        p.classList.toggle('active', Boolean(isMatch));
      });
      await loadSnapshot(filePath);
    }

    async function loadSnapshot(filePath, isBackgroundTick = false) {
      const btn = document.getElementById('refreshBtn');
      if (!isBackgroundTick) btn.textContent = '↻ Refreshing...';
      try {
        const data = await fetchJsonNoCache(filePath);
        currentPayload = data;
        if (!selectedDate && data.session_date) {
          selectedDate = data.session_date;
        }
        renderDashboard(data);
        updateModeButtons(data.mode);
        document.getElementById('ocTickClock').textContent = `Tick: ${new Date().toLocaleTimeString('en-IN')}`;
      } catch (err) {
        if (!isBackgroundTick) {
          document.getElementById('contentArea').innerHTML = `
            <div class="empty-box">
              <h3>Data snapshot not found yet (${filePath})</h3>
              <p style="margin-top:6px;">Run the GitHub Actions screener workflow once to generate <code>docs/data/latest.json</code> and daily history archives.</p>
            </div>`;
          document.getElementById('ocBody').innerHTML = `<div class="empty-box">Live option chain feed not published yet for <code>${filePath}</code>.</div>`;
        }
        updateModeButtons('');
      } finally {
        if (!isBackgroundTick) btn.textContent = '↻ Refresh Data';
      }
    }

    function populateSectorsAndChainSelector(payload) {
      const allItems = getAllSetups(payload);
      const sectors = Array.from(new Set(allItems.map(x => x.sector).filter(Boolean))).sort();
      const sel = document.getElementById('sectorFilter');
      const prev = sel.value;
      sel.innerHTML = `<option value="ALL">All Sectors</option>` +
        sectors.map(s => `<option value="${s}">${s}</option>`).join('');
      if (sectors.includes(prev)) sel.value = prev;

      const symList = Array.from(new Set(allItems.map(x => x.symbol).filter(Boolean)));
      const ocSel = document.getElementById('ocSymbolSelect');
      if (!selectedChainSymbol || !symList.includes(selectedChainSymbol)) {
        selectedChainSymbol = symList.includes('NIFTY') ? 'NIFTY' : (symList[0] || null);
      }
      ocSel.innerHTML = symList.map(sym =>
        `<option value="${sym}" ${sym === selectedChainSymbol ? 'selected' : ''}>${sym}</option>`
      ).join('');
    }

    function renderOptionChainPanel(payload) {
      const allItems = getAllSetups(payload);
      const item = allItems.find(x => x.symbol === selectedChainSymbol) || allItems[0];
      const titleEl = document.getElementById('ocTitle');
      const metaEl = document.getElementById('ocMeta');
      const bodyEl = document.getElementById('ocBody');

      if (!item) {
        titleEl.textContent = 'Live Option Chain';
        bodyEl.innerHTML = `<div class="empty-box">No instruments available in this snapshot.</div>`;
        return;
      }

      const cs = item.chain_summary || {};
      const rows = Array.isArray(item.option_chain) ? item.option_chain : [];

      titleEl.textContent = `Live Option Chain — ${item.symbol} (Spot: ${fmtNum(item.spot || item.entry)})`;
      metaEl.innerHTML = `
        Expiry: <strong class="mono">${fmtNum(item.option_expiry || cs.expiry)}</strong> •
        PCR: <strong class="mono">${fmtNum(cs.pcr)}</strong> •
        OI Build-up: <strong class="mono">${fmtNum(cs.oi_build_up)}</strong> •
        Max Pain: <strong class="mono">${fmtNum(cs.max_pain)}</strong> •
        Support: <strong class="pos mono">${fmtNum(cs.support_strike)}</strong> •
        Resistance: <strong class="neg mono">${fmtNum(cs.resistance_strike)}</strong>
      `;

      if (!rows.length) {
        bodyEl.innerHTML = `
          <div class="empty-box">
            <strong>Option chain strike rows not available in this run for ${item.symbol}.</strong>
            <p style="margin-top:6px; font-size:0.82rem;">Ensure Upstox option chain feed returns strikes for ${item.symbol} and re-run the workflow.</p>
          </div>`;
        return;
      }

      const bodyHtml = rows.map(r => {
        const isStrongSup = r.zone_role === 'STRONG_SUPPORT';
        const isStrongRes = r.zone_role === 'STRONG_RESISTANCE';
        const isWeakZone = r.zone_role === 'WEAK_SUPPORT' || r.zone_role === 'WEAK_RESISTANCE';

        const peBoxCls = isStrongSup ? 'cell-box-green' : (r.zone_role === 'WEAK_SUPPORT' ? 'cell-box-yellow' : '');
        const ceBoxCls = isStrongRes ? 'cell-box-red' : (r.zone_role === 'WEAK_RESISTANCE' ? 'cell-box-yellow' : '');
        const strikeBoxCls = isStrongSup ? 'cell-box-green' : (isStrongRes ? 'cell-box-red' : (isWeakZone ? 'cell-box-yellow' : ''));

        const roleTag = isStrongSup
          ? '<span class="box-pill box-strong-sup">STRONG SUPPORT</span>'
          : isStrongRes
          ? '<span class="box-pill box-strong-res">STRONG RESISTANCE</span>'
          : r.zone_role === 'WEAK_SUPPORT'
          ? '<span class="box-pill box-weak-sr">WEAK SUPPORT / SHIFT</span>'
          : r.zone_role === 'WEAK_RESISTANCE'
          ? '<span class="box-pill box-weak-sr">WEAK RESISTANCE / SHIFT</span>'
          : '<span style="color:var(--muted);">—</span>';

        return `
          <tr class="mono ${r.is_atm ? 'atm-row' : ''}">
            <td class="${ceBoxCls}">${fmtInt(r.ce_oi)}</td>
            <td class="${ceBoxCls} ${r.ce_chg_oi >= 0 ? 'pos' : 'neg'}">${r.ce_chg_oi >= 0 ? '+' : ''}${fmtInt(r.ce_chg_oi)} (${r.ce_chg_pct >= 0 ? '+' : ''}${fmtNum(r.ce_chg_pct)}%)</td>
            <td class="${ceBoxCls}">${r.ce_contracts >= 0 ? '+' : ''}${fmtInt(r.ce_contracts)}</td>
            <td>${fmtNum(r.ce_ltp)}</td>
            <td class="center ${strikeBoxCls}">${fmtNum(r.strike)}${r.is_atm ? ' ★' : ''}</td>
            <td>${fmtNum(r.pe_ltp)}</td>
            <td class="${peBoxCls}">${r.pe_contracts >= 0 ? '+' : ''}${fmtInt(r.pe_contracts)}</td>
            <td class="${peBoxCls} ${r.pe_chg_oi >= 0 ? 'pos' : 'neg'}">${r.pe_chg_oi >= 0 ? '+' : ''}${fmtInt(r.pe_chg_oi)} (${r.pe_chg_pct >= 0 ? '+' : ''}${fmtNum(r.pe_chg_pct)}%)</td>
            <td class="${peBoxCls}">${fmtInt(r.pe_oi)}</td>
            <td class="center">${roleTag}</td>
            <td class="impact-col">${r.impact_note || ''}</td>
          </tr>`;
      }).join('');

      bodyEl.innerHTML = `
        <div class="table-wrap">
          <table class="oc-table">
            <thead>
              <tr>
                <th>Call OI</th>
                <th>Call OI Chg (% )</th>
                <th>Call Cntr</th>
                <th>CE LTP</th>
                <th class="center">Strike</th>
                <th>PE LTP</th>
                <th>Put Cntr</th>
                <th>Put OI Chg (% )</th>
                <th>Put OI</th>
                <th class="center">Zone Box</th>
                <th style="text-align:left;">OI Change Impact</th>
              </tr>
            </thead>
            <tbody>${bodyHtml}</tbody>
          </table>
        </div>`;
    }

    function openChainForSymbol(sym) {
      selectedChainSymbol = sym;
      document.getElementById('ocSymbolSelect').value = sym;
      if (currentPayload) renderOptionChainPanel(currentPayload);
      document.getElementById('optionChainPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderCard(item, tagLabel) {
      const isBull = String(item.side || '').toUpperCase().includes('BULL') || String(item.action || '').toUpperCase().includes('BUY');
      const badgeCls = isBull ? 'badge-bull' : 'badge-bear';
      const oiHtml = item.oi_target ? `<span>OI Target: <strong class="mono">${item.oi_target}</strong></span>` : '';
      const vwapHtml = item.vwap ? `<span>VWAP: <strong class="mono">${item.vwap}</strong></span>` : '';

      return `
        <article class="card">
          <div class="card-head">
            <div>
              <div class="sym mono">${item.symbol} <span class="${chgClass(item.change_pct)}" style="font-size:0.85rem;">(${item.change_pct >= 0 ? '+' : ''}${fmtNum(item.change_pct)}%)</span></div>
              <div class="sector-tag">${item.sector || 'EQUITY'} • ${tagLabel} • Score: <strong class="mono">${fmtNum(item.score)}</strong></div>
            </div>
            <span class="badge ${badgeCls}">${item.side || 'SETUP'}</span>
          </div>

          <div class="levels mono">
            <div class="lvl"><span>Entry</span><strong>${fmtNum(item.entry)}</strong></div>
            <div class="lvl"><span>Stop Loss</span><strong class="neg">${fmtNum(item.stop_loss)}</strong></div>
            <div class="lvl"><span>Target 1</span><strong class="pos">${fmtNum(item.target_1)}</strong></div>
            <div class="lvl"><span>Target 2</span><strong class="pos">${fmtNum(item.target_2)}</strong></div>
          </div>

          <div class="meta-row">
            <span>Best Zone: <strong class="mono">${fmtNum(item.best_entry_low)}–${fmtNum(item.best_entry_high)}</strong></span>
            ${vwapHtml}
            ${oiHtml}
            <span>Qty: <strong class="mono">${fmtNum(item.qty)}</strong></span>
          </div>

          <div class="rationale">${item.why_trade || item.entry_action || 'Systematic technical & relative strength alignment.'}</div>

          <button type="button" class="chain-open-btn" onclick="openChainForSymbol('${item.symbol}')">
            📊 View Live Option Chain &amp; S/R Boxes (${item.symbol})
          </button>
        </article>`;
    }

    function renderDashboard(data) {
      const s = data.summary || {};
      document.getElementById('deskTitle').textContent = `${data.title || 'Quant & Hedging Desk'} [${data.mode || 'LIVE'}]`;
      document.getElementById('lastUpdated').textContent =
        `Session: ${data.session_date || '—'} • Mode: ${data.mode || '—'} • Generated: ${data.generated_at_ist || '—'} • Feed: ${s.data_source || '—'}`;

      const tone = String(s.breadth_tone || 'MIXED').toUpperCase();
      document.getElementById('statusDot').style.background = tone === 'BULLISH' ? 'var(--bull)' : (tone === 'BEARISH' ? 'var(--bear)' : 'var(--warn)');

      document.getElementById('kpiGrid').innerHTML = `
        <div class="kpi">
          <div class="kpi-label">NIFTY 50</div>
          <div class="kpi-val mono">${fmtNum(s.nifty_spot)}</div>
          <div class="kpi-sub mono ${chgClass(s.nifty_chg)}">${fmtNum(s.nifty_chg)}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">BANK NIFTY</div>
          <div class="kpi-val mono">${fmtNum(s.bnf_spot)}</div>
          <div class="kpi-sub mono ${chgClass(s.bnf_chg)}">${fmtNum(s.bnf_chg)}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">FIN NIFTY</div>
          <div class="kpi-val mono">${fmtNum(s.fin_spot)}</div>
          <div class="kpi-sub mono ${chgClass(s.fin_chg)}">${fmtNum(s.fin_chg)}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Market Breadth</div>
          <div class="kpi-val ${tone === 'BULLISH' ? 'pos' : (tone === 'BEARISH' ? 'neg' : 'neu')}">${tone}</div>
          <div class="kpi-sub mono">${fmtNum(s.breadth_ratio)} • &gt;EMA20: ${fmtNum(s.above_ema20)}%</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Active Ideas (${data.mode || 'RUN'})</div>
          <div class="kpi-val mono">${fmtNum(s.ideas_count)}</div>
          <div class="kpi-sub">Stock Setups: ${fmtNum(s.stock_setups_count)}</div>
        </div>
      `;

      populateSectorsAndChainSelector(data);

      const q = document.getElementById('searchInput').value.trim().toUpperCase();
      const sec = document.getElementById('sectorFilter').value;
      const filterFn = (arr) => (arr || []).filter(item => {
        const matchSym = !q || String(item.symbol || '').toUpperCase().includes(q);
        const matchSec = sec === 'ALL' || String(item.sector || '') === sec;
        return matchSym && matchSec;
      });

      const sections = [
        { key: 'INDEX', title: 'Index Option & Hedging Ideas', tag: 'INDEX', items: filterFn(data.index_trades) },
        { key: 'OPT_BULL', title: 'Options Bullish Candidates (Top 5)', tag: 'OPT BULL', items: filterFn(data.options_bullish || (data.setups || {}).bullish) },
        { key: 'OPT_BEAR', title: 'Options Bearish Candidates (Top 5)', tag: 'OPT BEAR', items: filterFn(data.options_bearish || (data.setups || {}).bearish) },
        { key: 'EQ_INTRA', title: 'Equity Intraday / Swing Setups', tag: 'EQUITY', items: filterFn(data.equity_intraday) },
      ].filter(secObj => activeTab === 'ALL' || activeTab === secObj.key);

      let html = '';
      sections.forEach(secObj => {
        if (!secObj.items.length) return;
        html += `
          <div class="section-title">
            <span>${secObj.title}</span>
            <span class="mono" style="font-size:0.8rem; color:var(--muted);">${secObj.items.length} setups</span>
          </div>
          <div class="cards-grid">${secObj.items.map(i => renderCard(i, secObj.tag)).join('')}</div>`;
      });

      document.getElementById('contentArea').innerHTML = html || `<div class="empty-box">No setups match the selected filter/date criteria.</div>`;
      renderOptionChainPanel(data);

      const wf = data.walk_forward || {};
      document.getElementById('wfBanner').innerHTML = `
        <div>
          <strong>Walk-Forward Ledger:</strong> Closed Trades: <span class="mono">${fmtNum(wf.closed_trades)}</span> •
          Win Rate: <span class="mono">${wf.net_win_rate_pct !== null && wf.net_win_rate_pct !== undefined ? wf.net_win_rate_pct + '%' : 'N/A'}</span> •
          Net P&amp;L: <span class="mono">₹${fmtNum(wf.total_net_pnl)}</span>
        </div>
        <div style="color:var(--warn); font-size:0.78rem;">${wf.sample_warning || ''}</div>
      `;
    }

    function startLiveTickTimer() {
      if (tickTimer) clearInterval(tickTimer);
      tickTimer = setInterval(async () => {
        if (!liveTickEnabled) return;
        await loadSnapshot(selectedFile, true);
      }, 10000);
    }

    document.getElementById('liveTickBtn').addEventListener('click', (e) => {
      liveTickEnabled = !liveTickEnabled;
      e.target.classList.toggle('live-on', liveTickEnabled);
      e.target.textContent = liveTickEnabled ? '● LIVE TICK (10s)' : '○ LIVE TICK PAUSED';
    });

    document.getElementById('ocSymbolSelect').addEventListener('change', (e) => {
      selectedChainSymbol = e.target.value;
      if (currentPayload) renderOptionChainPanel(currentPayload);
    });

    document.getElementById('btnLatest').addEventListener('click', () => switchSnapshot('data/latest.json', null));
    document.getElementById('btnMorning').addEventListener('click', () => {
      const f = findModeFileForDate(selectedDate, 'MORNING');
      if (f) switchSnapshot(f);
    });
    document.getElementById('btnBtst').addEventListener('click', () => {
      const f = findModeFileForDate(selectedDate, 'BTST');
      if (f) switchSnapshot(f);
    });

    document.getElementById('historySelect').addEventListener('change', (e) => switchSnapshot(e.target.value));
    document.getElementById('refreshBtn').addEventListener('click', async () => {
      await loadManifest();
      await loadSnapshot(selectedFile, false);
    });
    document.getElementById('searchInput').addEventListener('input', () => currentPayload && renderDashboard(currentPayload));
    document.getElementById('sectorFilter').addEventListener('change', () => currentPayload && renderDashboard(currentPayload));
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        if (currentPayload) renderDashboard(currentPayload);
      });
    });

    (async () => {
      await loadManifest();
      await loadSnapshot(selectedFile, false);
      startLiveTickTimer();
    })();
  </script>
</body>
</html>
