<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quant &amp; Hedging Desk — Institutional Screener Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-2: #172033;
      --border: #1f2d47;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --bull: #10b981;
      --bull-bg: rgba(16, 185, 129, 0.12);
      --bear: #f43f5e;
      --bear-bg: rgba(244, 63, 94, 0.12);
      --warn: #f59e0b;
      --warn-bg: rgba(245, 158, 11, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top right, #111d35 0%, var(--bg) 48%);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(12px);
      background: rgba(9, 13, 22, 0.9);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand { display: flex; align-items: center; gap: 11px; min-width: 220px; }
    .brand-dot {
      width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0;
      background: var(--warn);
      box-shadow: 0 0 10px var(--warn);
    }
    .brand h1 { font-size: 1.02rem; font-weight: 700; letter-spacing: 0.2px; }
    .brand small { display: block; color: var(--muted); font-size: 0.75rem; }

    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

    select, input[type="search"], input[type="url"], button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 0.82rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.16s ease, background 0.16s ease, transform 0.1s ease;
    }
    select:hover, input[type="search"]:hover, input[type="url"]:hover, button:hover {
      border-color: var(--accent);
    }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button.primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border-color: #38bdf8;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button.primary:disabled { opacity: 0.65; cursor: not-allowed; }
    button.primary:active:not(:disabled) { transform: scale(0.98); }

    button.toggle.active {
      background: rgba(16, 185, 129, 0.16);
      border-color: var(--bull);
      color: #a7f3d0;
      font-weight: 600;
    }

    .container { max-width: 1380px; margin: 0 auto; padding: 18px 20px 52px; }

    .status-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      margin-bottom: 14px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .status-badge {
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .st-fresh { background: var(--bull-bg); color: var(--bull); border: 1px solid rgba(16,185,129,0.35); }
    .st-stale { background: var(--warn-bg); color: var(--warn); border: 1px solid rgba(245,158,11,0.35); }
    .st-err { background: var(--bear-bg); color: var(--bear); border: 1px solid rgba(244,63,94,0.35); }

    .endpoint-drawer {
      display: none;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 0.8rem;
    }
    .endpoint-drawer.open { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .endpoint-drawer input[type="url"] { flex: 1 1 320px; }

    .history-ribbon {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .pill {
      white-space: nowrap;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.76rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      transition: 0.15s;
    }
    .pill.active {
      background: rgba(56, 189, 248, 0.16);
      border-color: var(--accent);
      color: var(--text);
      font-weight: 600;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      transition: background 0.25s ease;
    }
    .kpi.flash-up { background: rgba(16, 185, 129, 0.12); }
    .kpi.flash-down { background: rgba(244, 63, 94, 0.12); }
    .kpi-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); }
    .kpi-val { font-size: 1.3rem; font-weight: 700; margin-top: 4px; }
    .kpi-sub { font-size: 0.78rem; margin-top: 3px; color: var(--muted); }

    .pos { color: var(--bull); }
    .neg { color: var(--bear); }
    .neu { color: var(--warn); }

    .filter-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .tab {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
    }
    .tab.active {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--accent);
    }

    .section-title {
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin: 20px 0 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #e2e8f0;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 14px;
    }

    .card {
      background: linear-gradient(180deg, var(--surface) 0%, #0d1422 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      transition: transform 0.16s ease, border-color 0.16s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: #334b75; }

    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .sym { font-size: 1.08rem; font-weight: 700; }
    .sector-tag { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .badge-bull { background: var(--bull-bg); color: var(--bull); border: 1px solid rgba(16,185,129,0.3); }
    .badge-bear { background: var(--bear-bg); color: var(--bear); border: 1px solid rgba(244,63,94,0.3); }

    .levels {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px;
    }
    .lvl span { display: block; font-size: 0.66rem; color: var(--muted); text-transform: uppercase; }
    .lvl strong { font-size: 0.86rem; }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: 0.76rem;
      color: var(--muted);
    }
    .rationale {
      font-size: 0.79rem;
      color: #cbd5e1;
      background: rgba(30, 41, 59, 0.45);
      padding: 8px 10px;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }

    .opt-box {
      font-size: 0.76rem;
      background: rgba(56, 189, 248, 0.06);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      padding: 8px 10px;
      color: #bae6fd;
      line-height: 1.5;
    }

    .empty-box {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      color: var(--muted);
    }

    .wf-banner {
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
    }

    @media (max-width: 640px) {
      .topbar { padding: 10px 12px; }
      .container { padding: 14px 12px 44px; }
      .cards-grid { grid-template-columns: 1fr; }
      .levels { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-dot" id="statusDot"></div>
      <div>
        <h1 id="deskTitle">Quant &amp; Hedging Desk</h1>
        <small id="lastUpdated">Initializing terminal...</small>
      </div>
    </div>

    <div class="controls">
      <select id="historySelect" title="Select Historical Session">
        <option value="data/latest.json">Latest Run (Fresh)</option>
      </select>
      <button type="button" class="toggle" id="autoSyncBtn" title="Toggle 15s background re-check">Auto-Sync: OFF</button>
      <button type="button" id="endpointToggleBtn" title="Configure Live Run / Trigger Endpoint">Run Endpoint</button>
      <button class="primary" id="refreshBtn" type="button">↻ Refresh &amp; Run</button>
    </div>
  </header>

  <main class="container">
    <div class="endpoint-drawer" id="endpointDrawer">
      <label for="runEndpointInput" style="color:#cbd5e1;font-weight:600;">Live Run / Webhook URL (POST):</label>
      <input
        type="url"
        id="runEndpointInput"
        placeholder="Optional: https://your-backend/run-screener (leave blank for static JSON refresh)"
      />
      <button type="button" class="primary" id="saveEndpointBtn">Save</button>
      <button type="button" id="clearEndpointBtn">Clear</button>
      <small style="width:100%;color:var(--muted);">
        Note: Never embed API tokens or secrets in browser URLs/inputs. Static GitHub Pages refreshes from <code>data/latest.json</code>; a POST endpoint triggers live server execution when configured.
      </small>
    </div>

    <div class="status-strip">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span class="status-badge st-stale" id="freshnessBadge">CHECKING DATA</span>
        <span id="runStatusText">Ready.</span>
      </div>
      <div class="mono" id="checkedClock">Last checked: —</div>
    </div>

    <div class="history-ribbon" id="historyPills"></div>

    <section class="kpi-grid" id="kpiGrid"></section>

    <section class="filter-bar">
      <div class="tabs" id="categoryTabs">
        <button type="button" class="tab active" data-tab="ALL">All Setups</button>
        <button type="button" class="tab" data-tab="INDEX">Index Ideas</button>
        <button type="button" class="tab" data-tab="OPT_BULL">Options Bullish</button>
        <button type="button" class="tab" data-tab="OPT_BEAR">Options Bearish</button>
        <button type="button" class="tab" data-tab="EQ_INTRA">Equity Intraday</button>
      </div>
      <div class="controls">
        <select id="sectorFilter" aria-label="Filter by Sector">
          <option value="ALL">All Sectors</option>
        </select>
        <input type="search" id="searchInput" placeholder="Search symbol (e.g. RELIANCE)..." aria-label="Search symbol" />
      </div>
    </section>

    <div id="contentArea"></div>

    <section class="wf-banner" id="wfBanner"></section>
  </main>
  <script>
    const GH_CFG_KEY = 'mss_gh_dispatch_cfg_v1';
    let currentPayload = null;
    let activeTab = 'ALL';
    let selectedFile = 'data/latest.json';
    let autoSyncTimer = null;
    let isRefreshing = false;
    let prevSpotMap = {};

    function esc(v) {
      return String(v === null || v === undefined ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    const fmtNum = (v) => (v === null || v === undefined || v === '') ? '—' : esc(v);

    const chgClass = (txt) => {
      const s = String(txt || '');
      if (s.includes('-')) return 'neg';
      if (s.includes('+') || parseFloat(s) > 0) return 'pos';
      return 'neu';
    };

    function getGhConfig() {
      try {
        const raw = JSON.parse(localStorage.getItem(GH_CFG_KEY) || '{}');
        return {
          owner: (raw.owner || 'Yashraj306').trim(),
          repo: (raw.repo || 'My-Stock-Screener').trim(),
          workflow: (raw.workflow || 'screener.yml').trim(),
          ref: (raw.ref || 'main').trim(),
          token: (raw.token || '').trim(),
        };
      } catch {
        return { owner: 'Yashraj306', repo: 'My-Stock-Screener', workflow: 'screener.yml', ref: 'main', token: '' };
      }
    }

    function setRunStatus(msg, badgeType = 'st-stale', badgeLabel = 'SNAPSHOT') {
      document.getElementById('runStatusText').textContent = msg;
      const b = document.getElementById('freshnessBadge');
      b.className = `status-badge ${badgeType}`;
      b.textContent = badgeLabel;
      const nowStr = new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour12: false });
      document.getElementById('checkedClock').textContent = `Last checked: ${nowStr} IST`;
    }

    function evaluateFreshness(data) {
      const genRaw = data && (data.generated_at_ist || data.timestamp);
      if (!genRaw) {
        setRunStatus('Snapshot timestamp missing; verify data source.', 'st-stale', 'UNVERIFIED AGE');
        return;
      }
      const cleaned = String(genRaw).replace(' IST', '').trim();
      const parsed = Date.parse(cleaned.replace(' ', 'T') + '+05:30');
      if (Number.isNaN(parsed)) {
        setRunStatus(`Generated: ${genRaw}`, 'st-stale', 'SNAPSHOT');
        return;
      }
      const ageMin = Math.max(0, Math.round((Date.now() - parsed) / 60000));
      if (ageMin <= 5) {
        setRunStatus(`Snapshot age: ${ageMin} min (${genRaw})`, 'st-fresh', 'FRESH RUN');
      } else if (ageMin <= 1440) {
        setRunStatus(`Snapshot age: ${ageMin} min (${genRaw}) — batch snapshot`, 'st-stale', `${ageMin}M OLD`);
      } else {
        const hrs = Math.round(ageMin / 60);
        setRunStatus(`Snapshot is ${hrs}h old (${genRaw}) — market closed or run pending`, 'st-stale', 'STALE / CLOSED');
      }
    }

    async function fetchJsonNoCache(url) {
      const sep = url.includes('?') ? '&' : '?';
      const res = await fetch(`${url}${sep}_ts=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    async function loadManifest() {
      try {
        const manifest = await fetchJsonNoCache('data/manifest.json');
        const snapshots = Array.isArray(manifest.snapshots) ? manifest.snapshots : [];
        const sel = document.getElementById('historySelect');
        const pills = document.getElementById('historyPills');

        sel.innerHTML = `<option value="data/latest.json">Latest Run (Fresh)</option>`;
        pills.innerHTML = '';

        const latestPill = document.createElement('button');
        latestPill.type = 'button';
        latestPill.className = `pill ${selectedFile === 'data/latest.json' ? 'active' : ''}`;
        latestPill.dataset.file = 'data/latest.json';
        latestPill.textContent = '● Latest';
        latestPill.addEventListener('click', () => switchSnapshot('data/latest.json'));
        pills.appendChild(latestPill);

        const seenDates = new Set();
        snapshots.forEach((snap) => {
          const file = String(snap.file || '');
          if (!file) return;
          const opt = document.createElement('option');
          opt.value = file;
          opt.textContent = `${snap.date || ''} [${snap.mode || 'RUN'}] — ${snap.ideas_count ?? 0} Ideas (${snap.breadth_tone || 'MIXED'})`;
          sel.appendChild(opt);

          const dKey = String(snap.date || file);
          if (!seenDates.has(dKey) && seenDates.size < 12) {
            seenDates.add(dKey);
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `pill ${selectedFile === file ? 'active' : ''}`;
            btn.dataset.file = file;
            btn.textContent = `${snap.date || 'Run'} (${snap.ideas_count ?? 0})`;
            btn.addEventListener('click', () => switchSnapshot(file));
            pills.appendChild(btn);
          }
        });

        sel.value = selectedFile;
      } catch (e) {
        console.warn('Manifest load skipped:', e);
      }
    }

    async function switchSnapshot(filePath) {
      selectedFile = filePath;
      document.getElementById('historySelect').value = filePath;
      document.querySelectorAll('.pill').forEach((p) => {
        p.classList.toggle('active', p.dataset.file === filePath);
      });
      await loadSnapshot(filePath, true);
    }

    async function loadSnapshot(filePath, showLoadingMsg = false) {
      if (showLoadingMsg) {
        setRunStatus(`Loading ${filePath}...`, 'st-stale', 'LOADING');
      }
      try {
        const data = await fetchJsonNoCache(filePath);
        currentPayload = data;
        renderDashboard(data);
        evaluateFreshness(data);
        return data;
      } catch (err) {
        setRunStatus(`Failed to load ${filePath}: ${err.message}`, 'st-err', 'FETCH ERROR');
        document.getElementById('contentArea').innerHTML = `
          <div class="empty-box">
            <h3>Data snapshot not found (${esc(filePath)})</h3>
            <p style="margin-top:6px;">Trigger the workflow or run <code>screener.py</code> to generate <code>docs/data/latest.json</code>.</p>
          </div>`;
        return null;
      }
    }

    async function dispatchGitHubWorkflow(cfg) {
      const modeVal = (currentPayload && currentPayload.mode) || 'BTST';
      const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/actions/workflows/${encodeURIComponent(cfg.workflow)}/dispatches`;
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${cfg.token}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          ref: cfg.ref || 'main',
          inputs: { mode: modeVal },
        }),
      });
      if (!res.ok) {
        const errTxt = await res.text().catch(() => '');
        throw new Error(`GitHub Dispatch HTTP ${res.status}: ${errTxt.slice(0, 120)}`);
      }
    }

    async function pollUntilLatestUpdated(prevStamp, maxWaitMs = 120000) {
      const start = Date.now();
      const targetFile = 'data/latest.json';
      while ((Date.now() - start) < maxWaitMs) {
        await new Promise((r) => setTimeout(r, 2500));
        try {
          const fresh = await fetchJsonNoCache(targetFile);
          const newStamp = String(fresh.generated_at_ist || fresh.timestamp || '');
          if (newStamp && newStamp !== prevStamp) {
            selectedFile = targetFile;
            await loadManifest();
            currentPayload = fresh;
            renderDashboard(fresh);
            evaluateFreshness(fresh);
            return true;
          }
          const elapsedSec = Math.round((Date.now() - start) / 1000);
          setRunStatus(`Workflow running... waiting for updated snapshot (${elapsedSec}s)`, 'st-stale', 'RUNNING');
        } catch {
          // Ignore transient fetch error while commit is pushing
        }
      }
      return false;
    }

    async function triggerRefreshAndRun() {
      if (isRefreshing) return;
      isRefreshing = true;
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = '↻ Running...';

      const prevStamp = currentPayload ? String(currentPayload.generated_at_ist || currentPayload.timestamp || '') : '';
      const cfg = getGhConfig();

      try {
        if (cfg.token) {
          setRunStatus(`Dispatching ${cfg.owner}/${cfg.repo} (${cfg.workflow})...`, 'st-stale', 'DISPATCHING');
          await dispatchGitHubWorkflow(cfg);
          setRunStatus('Workflow dispatched; polling for fresh data...', 'st-stale', 'RUNNING');
          const updated = await pollUntilLatestUpdated(prevStamp, 120000);
          if (!updated) {
            await loadManifest();
            await loadSnapshot(selectedFile, false);
            setRunStatus('Workflow still running or no new timestamp yet; showing latest available data.', 'st-stale', 'PENDING');
          }
        } else {
          setRunStatus('No GitHub token saved; refreshing latest JSON snapshot...', 'st-stale', 'REFRESHING');
          await loadManifest();
          await loadSnapshot(selectedFile, false);
        }
      } catch (err) {
        setRunStatus(err.message, 'st-err', 'RUN ERROR');
      } finally {
        isRefreshing = false;
        btn.disabled = false;
        btn.textContent = '↻ Refresh & Run';
      }
    }

    function populateSectors(payload) {
      const allItems = [
        ...(payload.index_trades || []),
        ...(payload.options_bullish || []),
        ...(payload.options_bearish || []),
        ...(payload.equity_intraday || []),
      ];
      const sectors = Array.from(new Set(allItems.map((x) => x && x.sector).filter(Boolean))).sort();
      const sel = document.getElementById('sectorFilter');
      const prev = sel.value;
      sel.innerHTML = `<option value="ALL">All Sectors</option>` +
        sectors.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
      if (sectors.includes(prev)) sel.value = prev;
    }

    function renderOptionPlanBlock(opt) {
      if (!opt || !opt.available) return '';
      const strat = esc(opt.strategy || 'Option Plan');
      const buyStrike = opt.buy_leg && opt.buy_leg.strike !== undefined ? opt.buy_leg.strike : opt.strike;
      const sellStrike = opt.sell_leg && opt.sell_leg.strike !== undefined ? ` / Sell ${opt.sell_leg.strike}` : '';
      const lot = opt.lot_size ? `Lot: ${esc(opt.lot_size)}` : '';
      const maxLoss = opt.max_loss_lot !== undefined && opt.max_loss_lot !== null ? `Max Risk/Lot: ₹${esc(opt.max_loss_lot)}` : '';
      const be = opt.breakeven !== undefined && opt.breakeven !== null ? `BE: ₹${esc(opt.breakeven)}` : '';
      const parts = [strat, buyStrike ? `Buy ${esc(buyStrike)}${esc(sellStrike)}` : '', lot, be, maxLoss].filter(Boolean);
      return `<div class="opt-box mono"><strong>Option Plan:</strong> ${parts.join(' | ')}</div>`;
    }

    function renderCard(item, tagLabel) {
      const isBull = String(item.side || '').toUpperCase().includes('BULL') || String(item.action || '').toUpperCase().includes('BUY');
      const badgeCls = isBull ? 'badge-bull' : 'badge-bear';
      const chgNum = Number(item.change_pct);
      const chgDisp = Number.isFinite(chgNum) ? `(${chgNum >= 0 ? '+' : ''}${chgNum.toFixed(2)}%)` : '';
      const chgCls = Number.isFinite(chgNum) ? (chgNum > 0 ? 'pos' : (chgNum < 0 ? 'neg' : 'neu')) : 'neu';

      const ch = item.chain_summary || {};
      const oiParts = [
        ch.pcr !== undefined && ch.pcr !== null ? `PCR ${esc(ch.pcr)}` : '',
        ch.max_pain !== undefined && ch.max_pain !== null ? `MaxPain ${esc(ch.max_pain)}` : '',
        ch.oi_build_up ? esc(ch.oi_build_up) : '',
      ].filter(Boolean);

      return `
        <article class="card">
          <div class="card-head">
            <div>
              <div class="sym mono">${fmtNum(item.symbol)} <span class="${chgCls}" style="font-size:0.84rem;">${esc(chgDisp)}</span></div>
              <div class="sector-tag">${fmtNum(item.sector || 'EQUITY')} • ${fmtNum(tagLabel)} • Score: <strong class="mono">${fmtNum(item.score)}</strong></div>
            </div>
            <span class="badge ${badgeCls}">${fmtNum(item.side || 'SETUP')}</span>
          </div>

          <div class="levels mono">
            <div class="lvl"><span>Entry</span><strong>${fmtNum(item.entry)}</strong></div>
            <div class="lvl"><span>Stop Loss</span><strong class="neg">${fmtNum(item.stop_loss)}</strong></div>
            <div class="lvl"><span>Target 1</span><strong class="pos">${fmtNum(item.target_1)}</strong></div>
            <div class="lvl"><span>Target 2</span><strong class="pos">${fmtNum(item.target_2)}</strong></div>
          </div>

          <div class="meta-row">
            <span>Best Zone: <strong class="mono">${fmtNum(item.best_entry_low)}–${fmtNum(item.best_entry_high)}</strong></span>
            ${item.vwap ? `<span>VWAP: <strong class="mono">${fmtNum(item.vwap)}</strong></span>` : ''}
            ${item.oi_target ? `<span>OI Target: <strong class="mono">${fmtNum(item.oi_target)}</strong></span>` : ''}
            <span>Qty: <strong class="mono">${fmtNum(item.qty)}</strong></span>
            ${item.max_risk !== undefined && item.max_risk !== null ? `<span>Risk: <strong class="mono">₹${fmtNum(item.max_risk)}</strong></span>` : ''}
          </div>

          ${oiParts.length ? `<div class="meta-row"><span>OI Chain: <strong class="mono">${oiParts.join(' • ')}</strong></span></div>` : ''}
          ${renderOptionPlanBlock(item.option_plan)}
          <div class="rationale">${fmtNum(item.why_trade || item.entry_action || 'Systematic technical & relative strength alignment.')}</div>
        </article>`;
    }

    function flashIfChanged(key, newVal) {
      const prev = prevSpotMap[key];
      prevSpotMap[key] = newVal;
      if (!prev || prev === newVal) return '';
      const nPrev = parseFloat(String(prev).replace(/,/g, ''));
      const nNew = parseFloat(String(newVal).replace(/,/g, ''));
      if (!Number.isNaN(nPrev) && !Number.isNaN(nNew) && nPrev !== nNew) {
        return nNew > nPrev ? 'flash-up' : 'flash-down';
      }
      return '';
    }

    function renderDashboard(data) {
      const s = data.summary || {};
      document.getElementById('deskTitle').textContent = `${data.title || 'Quant & Hedging Desk'} [${data.mode || 'RUN'}]`;
      document.getElementById('lastUpdated').textContent =
        `Session: ${data.session_date || '—'} • Generated: ${data.generated_at_ist || '—'} • Feed: ${s.data_source || '—'}`;

      const tone = String(s.breadth_tone || 'MIXED').toUpperCase();
      const dot = document.getElementById('statusDot');
      dot.style.background = tone === 'BULLISH' ? 'var(--bull)' : (tone === 'BEARISH' ? 'var(--bear)' : 'var(--warn)');
      dot.style.boxShadow = `0 0 10px ${dot.style.background}`;

      const fNifty = flashIfChanged('nifty', s.nifty_spot);
      const fBnf = flashIfChanged('bnf', s.bnf_spot);
      const fFin = flashIfChanged('fin', s.fin_spot);

      document.getElementById('kpiGrid').innerHTML = `
        <div class="kpi ${fNifty}">
          <div class="kpi-label">NIFTY 50</div>
          <div class="kpi-val mono">${fmtNum(s.nifty_spot)}</div>
          <div class="kpi-sub mono ${chgClass(s.nifty_chg)}">${fmtNum(s.nifty_chg)}</div>
        </div>
        <div class="kpi ${fBnf}">
          <div class="kpi-label">BANK NIFTY</div>
          <div class="kpi-val mono">${fmtNum(s.bnf_spot)}</div>
          <div class="kpi-sub mono ${chgClass(s.bnf_chg)}">${fmtNum(s.bnf_chg)}</div>
        </div>
        <div class="kpi ${fFin}">
          <div class="kpi-label">FIN NIFTY</div>
          <div class="kpi-val mono">${fmtNum(s.fin_spot)}</div>
          <div class="kpi-sub mono ${chgClass(s.fin_chg)}">${fmtNum(s.fin_chg)}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Market Breadth</div>
          <div class="kpi-val ${tone === 'BULLISH' ? 'pos' : (tone === 'BEARISH' ? 'neg' : 'neu')}">${esc(tone)}</div>
          <div class="kpi-sub mono">${fmtNum(s.breadth_ratio)} • &gt;EMA20: ${fmtNum(s.above_ema20)}%</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Active Ideas</div>
          <div class="kpi-val mono">${fmtNum(s.ideas_count)}</div>
          <div class="kpi-sub">Stock Setups: ${fmtNum(s.stock_setups_count)}</div>
        </div>
      `;

      populateSectors(data);

      const q = document.getElementById('searchInput').value.trim().toUpperCase();
      const sec = document.getElementById('sectorFilter').value;
      const filterFn = (arr) => (arr || []).filter((item) => {
        if (!item) return false;
        const matchSym = !q || String(item.symbol || '').toUpperCase().includes(q);
        const matchSec = sec === 'ALL' || String(item.sector || '') === sec;
        return matchSym && matchSec;
      });

      const sections = [
        { key: 'INDEX', title: 'Index Option & Hedging Ideas', tag: 'INDEX', items: filterFn(data.index_trades) },
        { key: 'OPT_BULL', title: 'Options Bullish Candidates', tag: 'OPT BULL', items: filterFn(data.options_bullish || (data.setups || {}).bullish) },
        { key: 'OPT_BEAR', title: 'Options Bearish Candidates', tag: 'OPT BEAR', items: filterFn(data.options_bearish || (data.setups || {}).bearish) },
        { key: 'EQ_INTRA', title: 'Equity Intraday / Swing Setups', tag: 'EQUITY', items: filterFn(data.equity_intraday) },
      ].filter((secObj) => activeTab === 'ALL' || activeTab === secObj.key);

      let html = '';
      sections.forEach((secObj) => {
        if (!secObj.items.length) return;
        html += `
          <div class="section-title">
            <span>${esc(secObj.title)}</span>
            <span class="mono" style="font-size:0.78rem; color:var(--muted);">${secObj.items.length} setups</span>
          </div>
          <div class="cards-grid">${secObj.items.map((i) => renderCard(i, secObj.tag)).join('')}</div>`;
      });

      document.getElementById('contentArea').innerHTML = html || `<div class="empty-box">No setups match the selected filter/date criteria.</div>`;

      const wf = data.walk_forward || {};
      const wrDisp = (wf.net_win_rate_pct !== null && wf.net_win_rate_pct !== undefined)
        ? `${fmtNum(wf.net_win_rate_pct)}%`
        : 'N/A';

      document.getElementById('wfBanner').innerHTML = `
        <div>
          <strong>Walk-Forward Ledger:</strong> Closed Trades: <span class="mono">${fmtNum(wf.closed_trades)}</span> •
          Post-Cost Win Rate: <span class="mono">${wrDisp}</span> •
          Net P&amp;L: <span class="mono">₹${fmtNum(wf.total_net_pnl)}</span>
        </div>
        <div style="color:var(--warn); font-size:0.77rem;">${fmtNum(wf.sample_warning || 'Low sample size; do not treat small-sample results as proven.')}</div>
      `;
    }

    function toggleAutoSync() {
      const btn = document.getElementById('autoSyncBtn');
      if (autoSyncTimer) {
        clearInterval(autoSyncTimer);
        autoSyncTimer = null;
        btn.classList.remove('active');
        btn.textContent = 'Auto-Sync: OFF';
      } else {
        btn.classList.add('active');
        btn.textContent = 'Auto-Sync: 10s';
        autoSyncTimer = setInterval(() => {
          loadSnapshot(selectedFile, false);
        }, 10000);
      }
    }

    document.getElementById('historySelect').addEventListener('change', (e) => switchSnapshot(e.target.value));
    document.getElementById('refreshBtn').addEventListener('click', triggerRefreshAndRun);
    document.getElementById('autoSyncBtn').addEventListener('click', toggleAutoSync);

    document.getElementById('endpointToggleBtn').addEventListener('click', () => {
      const drawer = document.getElementById('endpointDrawer');
      const cfg = getGhConfig();
      const existingInput = document.getElementById('runEndpointInput');
      if (existingInput) existingInput.value = cfg.token;
      drawer.classList.toggle('open');
    });

    document.getElementById('saveEndpointBtn').addEventListener('click', () => {
      const tokenVal = (document.getElementById('runEndpointInput').value || '').trim();
      const cfg = getGhConfig();
      cfg.token = tokenVal;
      localStorage.setItem(GH_CFG_KEY, JSON.stringify(cfg));
      document.getElementById('endpointDrawer').classList.remove('open');
      setRunStatus(tokenVal ? 'GitHub workflow dispatch token saved locally.' : 'Token cleared; static JSON refresh active.', 'st-stale', 'CONFIGURED');
    });

    document.getElementById('clearEndpointBtn').addEventListener('click', () => {
      const cfg = getGhConfig();
      cfg.token = '';
      localStorage.setItem(GH_CFG_KEY, JSON.stringify(cfg));
      document.getElementById('runEndpointInput').value = '';
      setRunStatus('Token cleared; using static JSON refresh.', 'st-stale', 'STATIC MODE');
    });

    document.getElementById('searchInput').addEventListener('input', () => currentPayload && renderDashboard(currentPayload));
    document.getElementById('sectorFilter').addEventListener('change', () => currentPayload && renderDashboard(currentPayload));

    document.querySelectorAll('.tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        if (currentPayload) renderDashboard(currentPayload);
      });
    });

    (async () => {
      await loadManifest();
      await loadSnapshot(selectedFile, true);
    })();
  </script>
</body>
</html>
