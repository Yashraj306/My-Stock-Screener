<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quant &amp; Hedging Desk — Institutional Execution &amp; Option Chain Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b12;
      --surface: #0e1522;
      --surface-2: #141e30;
      --surface-3: #1a273d;
      --border: #22324d;
      --border-soft: rgba(34, 50, 77, 0.65);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --muted-2: #64748b;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --bull: #10b981;
      --bull-bg: rgba(16, 185, 129, 0.14);
      --bear: #f43f5e;
      --bear-bg: rgba(244, 63, 94, 0.14);
      --warn: #f59e0b;
      --warn-bg: rgba(245, 158, 11, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background:
        radial-gradient(ellipse 900px 420px at 85% -5%, rgba(56, 189, 248, 0.11), transparent 65%),
        radial-gradient(ellipse 700px 380px at 10% 0%, rgba(16, 185, 129, 0.07), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.48;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    .pos { color: var(--bull); }
    .neg { color: var(--bear); }
    .neu { color: var(--warn); }
    .muted { color: var(--muted); }

    /* Sticky Institutional Topbar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(14px);
      background: rgba(7, 11, 18, 0.88);
      border-bottom: 1px solid var(--border);
      padding: 11px 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .pulse-ring {
      position: relative;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--bull);
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
      flex-shrink: 0;
    }
    .brand h1 { font-size: 1rem; font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
    .mode-chip {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: 0.04em;
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
    }
    .mode-chip.btst {
      border-color: rgba(245, 158, 11, 0.45);
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
    }
    .brand small { display: block; color: var(--muted); font-size: 0.74rem; margin-top: 1px; }

    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

    .seg-group {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 2px;
      gap: 2px;
    }
    .seg-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .seg-btn:hover:not(:disabled) { color: var(--text); }
    .seg-btn.active-latest { background: rgba(16, 185, 129, 0.16); border-color: rgba(16, 185, 129, 0.5); color: #6ee7b7; }
    .seg-btn.active-morning { background: rgba(56, 189, 248, 0.18); border-color: rgba(56, 189, 248, 0.55); color: #7dd3fc; }
    .seg-btn.active-btst { background: rgba(245, 158, 11, 0.18); border-color: rgba(245, 158, 11, 0.55); color: #fcd34d; }
    .seg-btn.active-view { background: var(--surface-3); border-color: rgba(56, 189, 248, 0.4); color: #e2e8f0; }
    .seg-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    select, input[type="search"], button.btn-ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    input[type="search"] { cursor: text; min-width: 190px; }
    select:hover, input[type="search"]:hover, button.btn-ghost:hover { border-color: var(--accent); }
    input[type="search"]:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15); }

    button.btn-ghost.live-on {
      border-color: rgba(16, 185, 129, 0.55);
      background: rgba(16, 185, 129, 0.12);
      color: #6ee7b7;
      font-weight: 600;
    }
    button.btn-primary {
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
      border: 1px solid rgba(56, 189, 248, 0.6);
      color: #fff;
      border-radius: 8px;
      padding: 7px 13px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.15s ease;
    }
    button.btn-primary:hover { filter: brightness(1.08); }
    button.btn-primary:active { transform: scale(0.98); }

    .container { max-width: 1460px; margin: 0 auto; padding: 18px 22px 60px; }

    /* Session Guardrail & Risk Strip */
    .guardrail-bar {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .guardrail-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 15px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .guardrail-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .guardrail-title { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
    .guardrail-copy { font-size: 0.8rem; color: #cbd5e1; }
    .rule-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
    .rule-chip {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      color: var(--muted);
    }

    /* History Ribbon */
    .history-ribbon {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
      scrollbar-width: thin;
    }
    .pill {
      white-space: nowrap;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .pill:hover { border-color: rgba(56, 189, 248, 0.5); color: var(--text); }
    .pill.active {
      background: rgba(56, 189, 248, 0.16);
      border-color: var(--accent);
      color: #e0f2fe;
    }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi {
      background: linear-gradient(180deg, var(--surface) 0%, #0b111c 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 15px;
      position: relative;
      overflow: hidden;
    }
    .kpi::after {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 2px;
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.45), transparent);
    }
    .kpi-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .kpi-val { font-size: 1.32rem; font-weight: 800; margin-top: 4px; letter-spacing: -0.02em; }
    .kpi-sub { font-size: 0.75rem; margin-top: 3px; color: var(--muted); }

    /* Sub-strip: Global Cues & Sectors */
    .intel-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .intel-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .intel-heading { font-size: 0.73rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 8px; }
    .cues-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .cue-item {
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 0.74rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .sector-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .sec-chip {
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 0.74rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Filter & Action Bar */
    .filter-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .tab {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      transition: all 0.14s ease;
    }
    .tab:hover { color: var(--text); background: var(--surface-2); }
    .tab.active {
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.45);
      color: #7dd3fc;
    }

    /* Sections & Setup Cards */
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 22px 0 11px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-soft);
    }
    .section-title { font-size: 0.94rem; font-weight: 800; letter-spacing: -0.01em; color: #f8fafc; }
    .section-sub { font-size: 0.75rem; color: var(--muted); }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
      gap: 14px;
    }

    .card {
      background: linear-gradient(180deg, var(--surface) 0%, #0a101b 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .card:hover { border-color: rgba(56, 189, 248, 0.45); transform: translateY(-1px); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .sym { font-size: 1.08rem; font-weight: 800; letter-spacing: -0.01em; }
    .sub-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 3px; font-size: 0.72rem; color: var(--muted); }
    .tag-pill {
      padding: 1px 7px;
      border-radius: 5px;
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      color: #cbd5e1;
      font-weight: 600;
    }

    .badge {
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .badge-bull { background: var(--bull-bg); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.4); }
    .badge-bear { background: var(--bear-bg); color: #fda4af; border: 1px solid rgba(244,63,94,0.4); }

    .levels {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      background: rgba(9, 14, 24, 0.78);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 9px 10px;
    }
    .lvl span { display: block; font-size: 0.65rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .lvl strong { font-size: 0.88rem; font-weight: 700; margin-top: 2px; display: block; }

    .kv-strip {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px 12px;
      font-size: 0.75rem;
      color: var(--muted);
      background: rgba(20, 30, 48, 0.45);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .kv-strip strong { color: #e2e8f0; }

    .rationale {
      font-size: 0.78rem;
      color: #cbd5e1;
      background: rgba(26, 39, 61, 0.5);
      padding: 9px 11px;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }

    .chain-btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 9px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: rgba(56, 189, 248, 0.08);
      color: #7dd3fc;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.14s ease;
    }
    .chain-btn:hover { background: rgba(56, 189, 248, 0.18); }

    /* Compact Execution Table View */
    .exec-table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    table.exec-table { width: 100%; border-collapse: collapse; font-size: 0.77rem; }
    table.exec-table th {
      background: #0a101b;
      color: var(--muted);
      font-weight: 700;
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }
    table.exec-table th.num, table.exec-table td.num { text-align: right; }
    table.exec-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-soft);
      white-space: nowrap;
    }
    table.exec-table tr:hover td { background: rgba(56, 189, 248, 0.05); }

    /* Option Chain Panel */
    .oc-panel {
      margin-top: 26px;
      background: var(--surface);
      border: 1px solid #2b4166;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .oc-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .struct-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .struct-box {
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 0.74rem;
    }
    .struct-box span { display: block; color: var(--muted); font-size: 0.66rem; text-transform: uppercase; font-weight: 700; }
    .struct-box strong { font-size: 0.86rem; margin-top: 2px; display: block; }

    .legend-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.74rem;
    }
    .box-pill {
      padding: 3px 9px;
      border-radius: 6px;
      font-weight: 700;
      display: inline-block;
    }
    .box-strong-sup { background: var(--bull-bg); color: #6ee7b7; border: 1.5px solid var(--bull); }
    .box-strong-res { background: var(--bear-bg); color: #fda4af; border: 1.5px solid var(--bear); }
    .box-weak-sr { background: var(--warn-bg); color: #fde68a; border: 1.5px solid var(--warn); }

    .table-wrap { overflow-x: auto; max-height: 450px; overflow-y: auto; border-radius: 10px; border: 1px solid var(--border); }
    table.oc-table { width: 100%; border-collapse: collapse; font-size: 0.76rem; }
    table.oc-table th {
      position: sticky;
      top: 0;
      background: #0a101b;
      color: var(--muted);
      font-weight: 700;
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      text-align: right;
      z-index: 2;
    }
    table.oc-table th.center, table.oc-table td.center { text-align: center; }
    table.oc-table td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--border-soft);
      text-align: right;
      vertical-align: middle;
    }
    tr.atm-row { background: rgba(56, 189, 248, 0.09); }
    .cell-box-green { background: var(--bull-bg) !important; border: 1.5px solid var(--bull) !important; color: #a7f3d0 !important; font-weight: 700; border-radius: 5px; }
    .cell-box-red { background: var(--bear-bg) !important; border: 1.5px solid var(--bear) !important; color: #fecdd3 !important; font-weight: 700; border-radius: 5px; }
    .cell-box-yellow { background: var(--warn-bg) !important; border: 1.5px solid var(--warn) !important; color: #fef08a !important; font-weight: 700; border-radius: 5px; }
    .impact-col { text-align: left !important; min-width: 240px; font-size: 0.74rem; color: #cbd5e1; }

    .empty-box { background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; padding: 30px; text-align: center; color: var(--muted); }
    .wf-banner {
      margin-top: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
    }

    @media (max-width: 900px) {
      .guardrail-bar, .intel-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .cards-grid { grid-template-columns: 1fr; }
      .levels { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="pulse-ring" id="statusDot"></div>
      <div>
        <h1>
          <span id="deskTitle">Quant &amp; Hedging Desk</span>
          <span class="mode-chip mono" id="modeChip">LIVE</span>
        </h1>
        <small id="lastUpdated">Initializing market execution terminal...</small>
      </div>
    </div>

    <div class="controls">
      <div class="mode-switcher seg-group" role="group" aria-label="Screener Mode Switcher">
        <button type="button" class="seg-btn" id="btnLatest">LATEST</button>
        <button type="button" class="seg-btn" id="btnMorning">☀ MORNING</button>
        <button type="button" class="seg-btn" id="btnBtst">🌙 BTST</button>
      </div>

      <div class="seg-group" role="group" aria-label="Display Mode">
        <button type="button" class="seg-btn active-view" id="viewCardsBtn">Cards</button>
        <button type="button" class="seg-btn" id="viewTableBtn">Table</button>
      </div>

      <button type="button" class="btn-ghost live-on" id="liveTickBtn" title="Toggle Live Tick Polling">● LIVE TICK (10s)</button>

      <select id="historySelect" title="Select Historical Session">
        <option value="data/latest.json">Latest Run (Fresh)</option>
      </select>

      <button class="btn-primary" id="refreshBtn" type="button">↻ Refresh</button>
    </div>
  </header>

  <main class="container">
    <section class="guardrail-bar" id="guardrailBar"></section>

    <div class="history-ribbon" id="historyPills"></div>

    <section class="kpi-grid" id="kpiGrid"></section>

    <section class="intel-grid" id="intelGrid"></section>

    <section class="filter-bar">
      <div class="tabs" id="categoryTabs">
        <button class="tab active" data-tab="ALL">All Setups</button>
        <button class="tab" data-tab="INDEX">Index Ideas</button>
        <button class="tab" data-tab="OPT_BULL">Stock Options Bull</button>
        <button class="tab" data-tab="OPT_BEAR">Stock Options Bear</button>
        <button class="tab" data-tab="EQ_INTRA">Intraday Equity (10)</button>
      </div>
      <div class="controls">
        <select id="sectorFilter" title="Filter by Sector">
          <option value="ALL">All Sectors</option>
        </select>
        <input type="search" id="searchInput" placeholder="Search symbol (e.g. NIFTY, RELIANCE)..." />
      </div>
    </section>

    <div id="contentArea"></div>

    <section class="oc-panel" id="optionChainPanel">
      <div class="oc-header">
        <div>
          <h2 id="ocTitle" style="font-size:1.02rem; font-weight:800;">Live Option Chain &amp; Structural Levels</h2>
          <small id="ocMeta" style="color:var(--muted);">OI Change, Contracts Added, % Change &amp; Support/Resistance Impact</small>
        </div>
        <div class="controls">
          <select id="ocSymbolSelect" title="Select Symbol for Live Option Chain"></select>
          <span class="mono" id="ocTickClock" style="font-size:0.76rem; color:var(--accent);">Tick: —</span>
        </div>
      </div>

      <div class="struct-strip" id="ocStructStrip"></div>

      <div class="legend-strip">
        <span class="box-pill box-strong-sup">🟢 Strong Support (Green Box)</span>
        <span class="box-pill box-strong-res">🔴 Strong Resistance (Red Box)</span>
        <span class="box-pill box-weak-sr">🟡 Weak Support / Weak Resistance &amp; Shift (Yellow Box)</span>
      </div>

      <div id="ocBody"></div>
    </section>

    <section class="wf-banner" id="wfBanner"></section>
  </main>
  <script>
    let currentPayload = null;
    let allSnapshots = [];
    let activeTab = 'ALL';
    let viewMode = 'CARDS';
    let selectedFile = 'data/latest.json';
    let selectedDate = null;
    let selectedChainSymbol = null;
    let liveTickEnabled = true;
    let tickTimer = null;

    const fmtNum = (v) => (v === null || v === undefined || v === '') ? '—' : v;
    const fmtInt = (v) => {
      const n = Number(v);
      return Number.isFinite(n) ? n.toLocaleString('en-IN') : '—';
    };
    const chgClass = (txt) => {
      const s = String(txt || '');
      if (s.includes('-')) return 'neg';
      if (s.includes('+') || parseFloat(s) > 0) return 'pos';
      return 'neu';
    };

    async function fetchJsonNoCache(url) {
      const sep = url.includes('?') ? '&' : '?';
      const res = await fetch(`${url}${sep}_ts=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function getAllSetups(payload) {
      if (!payload) return [];
      return [
        ...(payload.index_trades || []),
        ...(payload.options_bullish || (payload.setups || {}).bullish || []),
        ...(payload.options_bearish || (payload.setups || {}).bearish || []),
        ...(payload.equity_intraday || []),
      ];
    }

    function findModeFileForDate(targetDate, targetMode) {
      const mUpper = targetMode.toUpperCase();
      if (targetDate) {
        const exact = allSnapshots.find(
          (s) => s.date === targetDate && String(s.mode || '').toUpperCase() === mUpper
        );
        if (exact) return exact.file;
      }
      const latestOfMode = allSnapshots.find(
        (s) => String(s.mode || '').toUpperCase() === mUpper
      );
      return latestOfMode ? latestOfMode.file : null;
    }

    function updateModeButtons(activeModeRaw) {
      const activeMode = String(activeModeRaw || '').toUpperCase();
      const btnLatest = document.getElementById('btnLatest');
      const btnMorning = document.getElementById('btnMorning');
      const btnBtst = document.getElementById('btnBtst');

      const morningFile = findModeFileForDate(selectedDate, 'MORNING');
      const btstFile = findModeFileForDate(selectedDate, 'BTST');

      btnMorning.disabled = !morningFile;
      btnBtst.disabled = !btstFile;

      btnLatest.className = 'seg-btn' + (selectedFile === 'data/latest.json' ? ' active-latest' : '');
      btnMorning.className = 'seg-btn' + (activeMode === 'MORNING' && selectedFile !== 'data/latest.json' ? ' active-morning' : '');
      btnBtst.className = 'seg-btn' + (activeMode === 'BTST' && selectedFile !== 'data/latest.json' ? ' active-btst' : '');

      if (selectedFile === 'data/latest.json') {
        if (activeMode === 'MORNING') btnMorning.classList.add('active-morning');
        if (activeMode === 'BTST') btnBtst.classList.add('active-btst');
      }
    }

    async function loadManifest() {
      try {
        const manifest = await fetchJsonNoCache('data/manifest.json');
        allSnapshots = manifest.snapshots || [];
        const sel = document.getElementById('historySelect');
        const pills = document.getElementById('historyPills');

        sel.innerHTML = `<option value="data/latest.json">Latest Run (Fresh)</option>`;
        pills.innerHTML = `<button class="pill ${selectedFile === 'data/latest.json' ? 'active' : ''}" data-file="data/latest.json">● Latest</button>`;

        const seenDates = new Set();
        allSnapshots.forEach((snap) => {
          const opt = document.createElement('option');
          opt.value = snap.file;
          opt.textContent = `${snap.date} [${snap.mode}] — ${snap.ideas_count} Ideas (${snap.breadth_tone})`;
          sel.appendChild(opt);

          if (!seenDates.has(snap.date) && seenDates.size < 14) {
            seenDates.add(snap.date);
            const btn = document.createElement('button');
            btn.className = `pill ${selectedFile === snap.file ? 'active' : ''}`;
            btn.dataset.file = snap.file;
            btn.dataset.date = snap.date;
            btn.textContent = `${snap.date} (${snap.ideas_count})`;
            btn.onclick = () => switchSnapshot(snap.file, snap.date);
            pills.appendChild(btn);
          }
        });

        pills.querySelector('[data-file="data/latest.json"]').onclick = () => switchSnapshot('data/latest.json', null);
        sel.value = selectedFile;
      } catch (e) {
        console.warn('Manifest not ready yet:', e);
      }
    }

    async function switchSnapshot(filePath, dateOverride = null) {
      selectedFile = filePath;
      if (dateOverride !== null) {
        selectedDate = dateOverride;
      } else if (filePath === 'data/latest.json') {
        selectedDate = null;
      } else {
        const found = allSnapshots.find((s) => s.file === filePath);
        if (found) selectedDate = found.date;
      }

      document.getElementById('historySelect').value = filePath;
      document.querySelectorAll('.pill').forEach(p => {
        const isMatch = p.dataset.file === filePath || (selectedDate && p.dataset.date === selectedDate);
        p.classList.toggle('active', Boolean(isMatch));
      });
      await loadSnapshot(filePath);
    }

    async function loadSnapshot(filePath, isBackgroundTick = false) {
      const btn = document.getElementById('refreshBtn');
      if (!isBackgroundTick) btn.textContent = '↻ Loading...';
      try {
        const data = await fetchJsonNoCache(filePath);
        currentPayload = data;
        if (!selectedDate && data.session_date) {
          selectedDate = data.session_date;
        }
        renderDashboard(data);
        updateModeButtons(data.mode);
        document.getElementById('ocTickClock').textContent = `Tick: ${new Date().toLocaleTimeString('en-IN')}`;
      } catch (err) {
        if (!isBackgroundTick) {
          document.getElementById('contentArea').innerHTML = `
            <div class="empty-box">
              <h3>Snapshot not published yet (${filePath})</h3>
              <p style="margin-top:6px;">Trigger the GitHub Actions screener workflow to generate <code>docs/data/latest.json</code> and history snapshots.</p>
            </div>`;
          document.getElementById('ocBody').innerHTML = `<div class="empty-box">Option chain feed unavailable until snapshot generation completes.</div>`;
        }
        updateModeButtons('');
      } finally {
        if (!isBackgroundTick) btn.textContent = '↻ Refresh';
      }
    }

    function populateSectorsAndChainSelector(payload) {
      const allItems = getAllSetups(payload);
      const sectors = Array.from(new Set(allItems.map(x => x.sector).filter(Boolean))).sort();
      const sel = document.getElementById('sectorFilter');
      const prev = sel.value;
      sel.innerHTML = `<option value="ALL">All Sectors (${sectors.length})</option>` +
        sectors.map(s => `<option value="${s}">${s}</option>`).join('');
      if (sectors.includes(prev)) sel.value = prev;

      const symList = Array.from(new Set(allItems.map(x => x.symbol).filter(Boolean)));
      const ocSel = document.getElementById('ocSymbolSelect');
      if (!selectedChainSymbol || !symList.includes(selectedChainSymbol)) {
        selectedChainSymbol = symList.includes('NIFTY') ? 'NIFTY' : (symList[0] || null);
      }
      ocSel.innerHTML = symList.map(sym =>
        `<option value="${sym}" ${sym === selectedChainSymbol ? 'selected' : ''}>${sym}</option>`
      ).join('');
    }

    function renderOptionChainPanel(payload) {
      const allItems = getAllSetups(payload);
      const item = allItems.find(x => x.symbol === selectedChainSymbol) || allItems[0];
      const titleEl = document.getElementById('ocTitle');
      const metaEl = document.getElementById('ocMeta');
      const structEl = document.getElementById('ocStructStrip');
      const bodyEl = document.getElementById('ocBody');

      if (!item) {
        titleEl.textContent = 'Live Option Chain & Structural Levels';
        structEl.innerHTML = '';
        bodyEl.innerHTML = `<div class="empty-box">No instruments available in this snapshot.</div>`;
        return;
      }

      const cs = item.chain_summary || {};
      const ca = item.chain_analytics || {};
      const rows = Array.isArray(item.option_chain) ? item.option_chain : [];

      titleEl.textContent = `Live Option Chain — ${item.symbol} (Spot: ${fmtNum(item.spot || item.entry)})`;
      metaEl.innerHTML = `
        Expiry: <strong class="mono">${fmtNum(item.option_expiry || cs.expiry)}</strong> •
        PCR: <strong class="mono">${fmtNum(cs.pcr)}</strong> •
        OI Build-up: <strong class="mono">${fmtNum(cs.oi_build_up)}</strong> •
        Max Pain: <strong class="mono">${fmtNum(cs.max_pain)}</strong>
      `;

      structEl.innerHTML = `
        <div class="struct-box">
          <span>Market Regime State</span>
          <strong class="mono">${fmtNum(ca.sentiment_state)}</strong>
        </div>
        <div class="struct-box">
          <span>Strong / Weak Support</span>
          <strong class="pos mono">${fmtNum(ca.strong_support)} / ${fmtNum(ca.weak_support)} (${fmtNum(ca.support_shift)} ${fmtNum(ca.support_shift_pct)}%)</strong>
        </div>
        <div class="struct-box">
          <span>Strong / Weak Resistance</span>
          <strong class="neg mono">${fmtNum(ca.strong_resistance)} / ${fmtNum(ca.weak_resistance)} (${fmtNum(ca.resistance_shift)} ${fmtNum(ca.resistance_shift_pct)}%)</strong>
        </div>
        <div class="struct-box">
          <span>EOS (±1 Divergence)</span>
          <strong class="pos mono">${fmtNum(ca.eos)} <small class="muted">(${fmtNum(ca.eos_minus_1)} / ${fmtNum(ca.eos_plus_1)})</small></strong>
        </div>
        <div class="struct-box">
          <span>EOR (±1 Divergence)</span>
          <strong class="neg mono">${fmtNum(ca.eor)} <small class="muted">(${fmtNum(ca.eor_minus_1)} / ${fmtNum(ca.eor_plus_1)})</small></strong>
        </div>
      `;

      if (!rows.length) {
        bodyEl.innerHTML = `
          <div class="empty-box">
            <strong>Option chain strike rows unavailable for ${item.symbol} in this run.</strong>
            <p style="margin-top:6px; font-size:0.78rem;">Verify live F&amp;O contract mapping and market-hours Upstox feed for ${item.symbol}.</p>
          </div>`;
        return;
      }

      const bodyHtml = rows.map(r => {
        const isStrongSup = r.zone_role === 'STRONG_SUPPORT';
        const isStrongRes = r.zone_role === 'STRONG_RESISTANCE';
        const isWeakZone = r.zone_role === 'WEAK_SUPPORT' || r.zone_role === 'WEAK_RESISTANCE';

        const peBoxCls = isStrongSup ? 'cell-box-green' : (r.zone_role === 'WEAK_SUPPORT' ? 'cell-box-yellow' : '');
        const ceBoxCls = isStrongRes ? 'cell-box-red' : (r.zone_role === 'WEAK_RESISTANCE' ? 'cell-box-yellow' : '');
        const strikeBoxCls = isStrongSup ? 'cell-box-green' : (isStrongRes ? 'cell-box-red' : (isWeakZone ? 'cell-box-yellow' : ''));

        const roleTag = isStrongSup
          ? '<span class="box-pill box-strong-sup">STRONG SUPPORT</span>'
          : isStrongRes
          ? '<span class="box-pill box-strong-res">STRONG RESISTANCE</span>'
          : r.zone_role === 'WEAK_SUPPORT'
          ? '<span class="box-pill box-weak-sr">WEAK SUPPORT / SHIFT</span>'
          : r.zone_role === 'WEAK_RESISTANCE'
          ? '<span class="box-pill box-weak-sr">WEAK RESISTANCE / SHIFT</span>'
          : '<span class="muted">—</span>';

        return `
          <tr class="mono ${r.is_atm ? 'atm-row' : ''}">
            <td class="${ceBoxCls}">${fmtInt(r.ce_oi)}</td>
            <td class="${ceBoxCls} ${r.ce_chg_oi >= 0 ? 'pos' : 'neg'}">${r.ce_chg_oi >= 0 ? '+' : ''}${fmtInt(r.ce_chg_oi)} (${r.ce_chg_pct >= 0 ? '+' : ''}${fmtNum(r.ce_chg_pct)}%)</td>
            <td class="${ceBoxCls}">${r.ce_contracts >= 0 ? '+' : ''}${fmtInt(r.ce_contracts)}</td>
            <td>${fmtNum(r.ce_ltp)}</td>
            <td class="center ${strikeBoxCls}">${fmtNum(r.strike)}${r.is_atm ? ' ★' : ''}</td>
            <td>${fmtNum(r.pe_ltp)}</td>
            <td class="${peBoxCls}">${r.pe_contracts >= 0 ? '+' : ''}${fmtInt(r.pe_contracts)}</td>
            <td class="${peBoxCls} ${r.pe_chg_oi >= 0 ? 'pos' : 'neg'}">${r.pe_chg_oi >= 0 ? '+' : ''}${fmtInt(r.pe_chg_oi)} (${r.pe_chg_pct >= 0 ? '+' : ''}${fmtNum(r.pe_chg_pct)}%)</td>
            <td class="${peBoxCls}">${fmtInt(r.pe_oi)}</td>
            <td class="center">${roleTag}</td>
            <td class="impact-col">${r.impact_note || ''}</td>
          </tr>`;
      }).join('');

      bodyEl.innerHTML = `
        <div class="table-wrap">
          <table class="oc-table">
            <thead>
              <tr>
                <th>Call OI</th>
                <th>Call OI Chg (%)</th>
                <th>Call Cntr</th>
                <th>CE LTP</th>
                <th class="center">Strike</th>
                <th>PE LTP</th>
                <th>Put Cntr</th>
                <th>Put OI Chg (%)</th>
                <th>Put OI</th>
                <th class="center">Zone Box</th>
                <th style="text-align:left;">OI Change Impact</th>
              </tr>
            </thead>
            <tbody>${bodyHtml}</tbody>
          </table>
        </div>`;
    }

    function openChainForSymbol(sym) {
      selectedChainSymbol = sym;
      document.getElementById('ocSymbolSelect').value = sym;
      if (currentPayload) renderOptionChainPanel(currentPayload);
      document.getElementById('optionChainPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderCard(item, tagLabel) {
      const isBull = String(item.side || '').toUpperCase().includes('BULL') || String(item.action || '').toUpperCase().includes('BUY');
      const badgeCls = isBull ? 'badge-bull' : 'badge-bear';
      const optPlan = item.option_plan || {};
      const planText = optPlan.strategy_name || optPlan.summary || (item.equity_bucket || 'Cash / Intraday Execution');
      const rngVal = item.avg_range_rs ? `₹${item.avg_range_rs}` : '—';

      return `
        <article class="card">
          <div class="card-top">
            <div>
              <div class="sym mono">
                ${item.symbol}
                <span class="${chgClass(item.change_pct)}" style="font-size:0.84rem; margin-left:4px;">(${item.change_pct >= 0 ? '+' : ''}${fmtNum(item.change_pct)}%)</span>
              </div>
              <div class="sub-tags">
                <span class="tag-pill">${item.sector || 'EQUITY'}</span>
                <span class="tag-pill">${tagLabel}</span>
                <span>Score: <strong class="mono">${fmtNum(item.score)}</strong></span>
                ${item.avg_range_rs ? `<span>AvgRng: <strong class="mono">${rngVal}</strong></span>` : ''}
              </div>
            </div>
            <span class="badge ${badgeCls}">${item.side || 'SETUP'}</span>
          </div>

          <div class="levels mono">
            <div class="lvl"><span>Entry</span><strong>${fmtNum(item.entry)}</strong></div>
            <div class="lvl"><span>Stop Loss</span><strong class="neg">${fmtNum(item.stop_loss)}</strong></div>
            <div class="lvl"><span>Target 1</span><strong class="pos">${fmtNum(item.target_1)}</strong></div>
            <div class="lvl"><span>Target 2</span><strong class="pos">${fmtNum(item.target_2)}</strong></div>
          </div>

          <div class="kv-strip">
            <div>Best Zone: <strong class="mono">${fmtNum(item.best_entry_low)}–${fmtNum(item.best_entry_high)}</strong></div>
            <div>VWAP / OI Tgt: <strong class="mono">${fmtNum(item.vwap)} / ${fmtNum(item.oi_target)}</strong></div>
            <div>Qty / Sizing: <strong class="mono">${fmtNum(item.qty)}</strong></div>
            <div>Timing: <strong class="mono">${fmtNum(item.extension_status)}</strong></div>
            <div style="grid-column: 1 / -1;">Execution Plan: <strong>${fmtNum(planText)}</strong></div>
          </div>

          <div class="rationale">${item.why_trade || item.entry_action || 'Systematic technical & relative strength alignment.'}</div>

          <button type="button" class="chain-btn" onclick="openChainForSymbol('${item.symbol}')">
            📊 Inspect Option Chain &amp; S/R Zones (${item.symbol})
          </button>
        </article>`;
    }

    function renderExecutionTable(items, tagLabel) {
      const rows = items.map(item => {
        const isBull = String(item.side || '').toUpperCase().includes('BULL');
        return `
          <tr class="mono">
            <td><strong>${item.symbol}</strong> <span class="muted" style="font-size:0.7rem;">(${item.sector || 'EQ'})</span></td>
            <td><span class="badge ${isBull ? 'badge-bull' : 'badge-bear'}">${item.side || tagLabel}</span></td>
            <td class="num ${chgClass(item.change_pct)}">${item.change_pct >= 0 ? '+' : ''}${fmtNum(item.change_pct)}%</td>
            <td class="num">${fmtNum(item.entry)}</td>
            <td class="num neg">${fmtNum(item.stop_loss)}</td>
            <td class="num pos">${fmtNum(item.target_1)}</td>
            <td class="num pos">${fmtNum(item.target_2)}</td>
            <td class="num">${fmtNum(item.oi_target)}</td>
            <td class="num">${item.avg_range_rs ? '₹' + item.avg_range_rs : '—'}</td>
            <td class="num">${fmtNum(item.qty)}</td>
            <td>${fmtNum(item.extension_status)}</td>
            <td><button type="button" class="btn-ghost" style="padding:3px 8px; font-size:0.72rem;" onclick="openChainForSymbol('${item.symbol}')">Chain</button></td>
          </tr>`;
      }).join('');

      return `
        <div class="exec-table-wrap">
          <table class="exec-table">
            <thead>
              <tr>
                <th>Symbol</th>
                <th>Side</th>
                <th class="num">Chg%</th>
                <th class="num">Entry</th>
                <th class="num">Stop Loss</th>
                <th class="num">Target 1</th>
                <th class="num">Target 2</th>
                <th class="num">OI Target</th>
                <th class="num">Avg Rng</th>
                <th class="num">Qty</th>
                <th>Timing</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    function renderDashboard(data) {
      const s = data.summary || {};
      const sg = data.session_guardrails || {};
      const modeStr = String(data.mode || 'LIVE').toUpperCase();

      document.getElementById('deskTitle').textContent = data.title || 'Quant & Hedging Desk';
      const chip = document.getElementById('modeChip');
      chip.textContent = modeStr;
      chip.className = 'mode-chip mono' + (modeStr === 'BTST' ? ' btst' : '');

      document.getElementById('lastUpdated').textContent =
        `Session ${data.session_date || '—'} • Generated ${data.generated_at_ist || '—'} • Feed: ${s.data_source || '—'}`;

      const tone = String(s.breadth_tone || 'MIXED').toUpperCase();
      document.getElementById('statusDot').style.background = tone === 'BULLISH' ? 'var(--bull)' : (tone === 'BEARISH' ? 'var(--bear)' : 'var(--warn)');

      const rulesHtml = (sg.rules || []).slice(0, 3).map(r => `<span class="rule-chip">${r}</span>`).join('');
      const capText = s.capital_configured
        ? `Capital: ₹${fmtInt(s.capital)} • Risk/Trade: ${fmtNum(s.risk_pct)}%`
        : `Capital: Not Configured (1-Lot / Baseline Sizing) • Risk/Trade: ${fmtNum(s.risk_pct)}%`;

      document.getElementById('guardrailBar').innerHTML = `
        <div class="guardrail-card">
          <div class="guardrail-top">
            <span class="guardrail-title">Session Guardrail: ${fmtNum(sg.window_status || 'STANDARD SESSION')}</span>
            <span class="mono muted" style="font-size:0.72rem;">9:15–9:25 Calib • 2:30 PM Cutoff</span>
          </div>
          <div class="guardrail-copy">${fmtNum(sg.window_note || 'Monitor WTT/WTB shifts and EOS/EOR boundaries before entry.')}</div>
          <div class="rule-chips">${rulesHtml}</div>
        </div>
        <div class="guardrail-card">
          <div class="guardrail-top">
            <span class="guardrail-title">Risk &amp; Allocation Desk</span>
            <span class="mono muted" style="font-size:0.72rem;">Zero Option/Equity Overlap</span>
          </div>
          <div class="guardrail-copy mono">${capText}</div>
          <div class="rule-chips">
            <span class="rule-chip">Stock Options: Top 5 Bull / 5 Bear</span>
            <span class="rule-chip">Intraday Equity: 10 Dedicated (₹20–₹50 Range Focus)</span>
          </div>
        </div>
      `;

      document.getElementById('kpiGrid').innerHTML = `
        <div class="kpi">
          <div class="kpi-label">NIFTY 50</div>
          <div class="kpi-val mono">${fmtNum(s.nifty_spot)}</div>
          <div class="kpi-sub mono ${chgClass(s.nifty_chg)}">${fmtNum(s.nifty_chg)}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">BANK NIFTY</div>
          <div class="kpi-val mono">${fmtNum(s.bnf_spot)}</div>
          <div class="kpi-sub mono ${chgClass(s.bnf_chg)}">${fmtNum(s.bnf_chg)}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">FIN NIFTY</div>
          <div class="kpi-val mono">${fmtNum(s.fin_spot)}</div>
          <div class="kpi-sub mono ${chgClass(s.fin_chg)}">${fmtNum(s.fin_chg)}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Market Breadth</div>
          <div class="kpi-val ${tone === 'BULLISH' ? 'pos' : (tone === 'BEARISH' ? 'neg' : 'neu')}">${tone}</div>
          <div class="kpi-sub mono">${fmtNum(s.breadth_ratio)} • &gt;EMA20: ${fmtNum(s.above_ema20)}%</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Active Ideas (${modeStr})</div>
          <div class="kpi-val mono">${fmtNum(s.ideas_count)}</div>
          <div class="kpi-sub">Options + 10 Intraday Eq: ${fmtNum(s.stock_setups_count)}</div>
        </div>
      `;

      const cues = Array.isArray(data.global_cues) ? data.global_cues : [];
      const cuesHtml = cues.length
        ? cues.slice(0, 8).map(c => {
            const name = c.name || c.symbol || 'Cue';
            const val = c.price || c.last || c.value || '';
            const chg = c.change_pct !== undefined ? `${Number(c.change_pct) >= 0 ? '+' : ''}${c.change_pct}%` : (c.change || '');
            return `<span class="cue-item mono"><span>${name}</span><strong>${fmtNum(val)}</strong><span class="${chgClass(chg)}">${fmtNum(chg)}</span></span>`;
          }).join('')
        : `<span class="muted" style="font-size:0.76rem;">Global cues feed unavailable in this snapshot.</span>`;

      const sectorsArr = Array.isArray(data.sectors)
        ? data.sectors
        : Object.entries(data.sectors || {}).map(([k, v]) => ({ sector: k, ...(typeof v === 'object' ? v : { score: v }) }));
      const secHtml = sectorsArr.length
        ? sectorsArr.slice(0, 10).map(secObj => {
            const sName = secObj.sector || secObj.name || 'SECTOR';
            const sVal = secObj.avg_change_pct !== undefined ? `${Number(secObj.avg_change_pct) >= 0 ? '+' : ''}${Number(secObj.avg_change_pct).toFixed(2)}%` : fmtNum(secObj.score);
            return `<span class="sec-chip mono"><span>${sName}</span><strong class="${chgClass(sVal)}">${sVal}</strong></span>`;
          }).join('')
        : `<span class="muted" style="font-size:0.76rem;">Sector rotation metrics unavailable.</span>`;

      document.getElementById('intelGrid').innerHTML = `
        <div class="intel-box">
          <div class="intel-heading">Global Macro &amp; Overnight Cues</div>
          <div class="cues-list">${cuesHtml}</div>
        </div>
        <div class="intel-box">
          <div class="intel-heading">Sector Strength &amp; Rotation</div>
          <div class="sector-chips">${secHtml}</div>
        </div>
      `;

      populateSectorsAndChainSelector(data);

      const q = document.getElementById('searchInput').value.trim().toUpperCase();
      const sec = document.getElementById('sectorFilter').value;
      const filterFn = (arr) => (arr || []).filter(item => {
        const matchSym = !q || String(item.symbol || '').toUpperCase().includes(q);
        const matchSec = sec === 'ALL' || String(item.sector || '') === sec;
        return matchSym && matchSec;
      });

      const sections = [
        { key: 'INDEX', title: 'Index Option & Hedging Desk', sub: 'NIFTY • BANKNIFTY • FINNIFTY • SENSEX', tag: 'INDEX', items: filterFn(data.index_trades) },
        { key: 'OPT_BULL', title: 'Stock Options — Bullish Candidates', sub: 'High-conviction CE / Bull Spread setups', tag: 'OPT BULL', items: filterFn(data.options_bullish || (data.setups || {}).bullish) },
        { key: 'OPT_BEAR', title: 'Stock Options — Bearish Candidates', sub: 'High-conviction PE / Bear Spread setups', tag: 'OPT BEAR', items: filterFn(data.options_bearish || (data.setups || {}).bearish) },
        { key: 'EQ_INTRA', title: `Intraday Equity Basket (${modeStr})`, sub: '10 Non-Overlapping Stocks • ₹20–₹50 Daily Range Priority', tag: 'EQ INTRA', items: filterFn(data.equity_intraday) },
      ].filter(secObj => activeTab === 'ALL' || activeTab === secObj.key);

      let html = '';
      sections.forEach(secObj => {
        if (!secObj.items.length) return;
        const bodyContent = viewMode === 'TABLE'
          ? renderExecutionTable(secObj.items, secObj.tag)
          : `<div class="cards-grid">${secObj.items.map(i => renderCard(i, secObj.tag)).join('')}</div>`;
        html += `
          <div class="section-head">
            <div>
              <div class="section-title">${secObj.title}</div>
              <div class="section-sub">${secObj.sub}</div>
            </div>
            <span class="mono muted" style="font-size:0.78rem;">${secObj.items.length} setups</span>
          </div>
          ${bodyContent}`;
      });

      document.getElementById('contentArea').innerHTML = html || `<div class="empty-box">No setups match the active tab, sector, or symbol search filter.</div>`;
      renderOptionChainPanel(data);

      const wf = data.walk_forward || {};
      const costsVal = wf.total_costs !== undefined ? wf.total_costs : (wf.total_est_charges || 0);
      document.getElementById('wfBanner').innerHTML = `
        <div>
          <strong>Walk-Forward Audit Ledger:</strong>
          Closed: <span class="mono">${fmtNum(wf.closed_trades)}</span> •
          Win Rate: <span class="mono">${wf.net_win_rate_pct !== null && wf.net_win_rate_pct !== undefined ? wf.net_win_rate_pct + '%' : 'N/A'}</span> •
          Est. Charges: <span class="mono">₹${fmtNum(costsVal)}</span> •
          Net P&amp;L: <span class="mono">₹${fmtNum(wf.total_net_pnl)}</span> •
          Max Drawdown: <span class="mono">₹${fmtNum(wf.max_drawdown_net_pnl)}</span>
        </div>
        <div class="neu" style="font-size:0.75rem;">${wf.sample_warning || 'Research & risk-management analytics only; not guaranteed performance.'}</div>
      `;
    }

    function startLiveTickTimer() {
      if (tickTimer) clearInterval(tickTimer);
      tickTimer = setInterval(async () => {
        if (!liveTickEnabled) return;
        await loadSnapshot(selectedFile, true);
      }, 10000);
    }

    document.getElementById('viewCardsBtn').addEventListener('click', () => {
      viewMode = 'CARDS';
      document.getElementById('viewCardsBtn').classList.add('active-view');
      document.getElementById('viewTableBtn').classList.remove('active-view');
      if (currentPayload) renderDashboard(currentPayload);
    });

    document.getElementById('viewTableBtn').addEventListener('click', () => {
      viewMode = 'TABLE';
      document.getElementById('viewTableBtn').classList.add('active-view');
      document.getElementById('viewCardsBtn').classList.remove('active-view');
      if (currentPayload) renderDashboard(currentPayload);
    });

    document.getElementById('liveTickBtn').addEventListener('click', (e) => {
      liveTickEnabled = !liveTickEnabled;
      e.target.classList.toggle('live-on', liveTickEnabled);
      e.target.textContent = liveTickEnabled ? '● LIVE TICK (10s)' : '○ LIVE TICK PAUSED';
    });

    document.getElementById('ocSymbolSelect').addEventListener('change', (e) => {
      selectedChainSymbol = e.target.value;
      if (currentPayload) renderOptionChainPanel(currentPayload);
    });

    document.getElementById('btnLatest').addEventListener('click', () => switchSnapshot('data/latest.json', null));
    document.getElementById('btnMorning').addEventListener('click', () => {
      const f = findModeFileForDate(selectedDate, 'MORNING');
      if (f) switchSnapshot(f);
    });
    document.getElementById('btnBtst').addEventListener('click', () => {
      const f = findModeFileForDate(selectedDate, 'BTST');
      if (f) switchSnapshot(f);
    });

    document.getElementById('historySelect').addEventListener('change', (e) => switchSnapshot(e.target.value));
    document.getElementById('refreshBtn').addEventListener('click', async () => {
      await loadManifest();
      await loadSnapshot(selectedFile, false);
    });
    document.getElementById('searchInput').addEventListener('input', () => currentPayload && renderDashboard(currentPayload));
    document.getElementById('sectorFilter').addEventListener('change', () => currentPayload && renderDashboard(currentPayload));
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        if (currentPayload) renderDashboard(currentPayload);
      });
    });

    (async () => {
      await loadManifest();
      await loadSnapshot(selectedFile, false);
      startLiveTickTimer();
    })();
  </script>
</body>
</html>
