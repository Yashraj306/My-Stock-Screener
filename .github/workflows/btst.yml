name: BTST Screener

on:
  schedule:
    - cron: "7 8 * * 1-5"   # 01:37 PM IST, Mon-Fri (main run)
    - cron: "37 8 * * 1-5"  # 02:07 PM IST, Mon-Fri (backup)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screener-log
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Today's date (IST)
        id: d
        run: echo "day=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      - name: Check if today's report was already sent
        id: sent
        uses: actions/cache@v4
        with:
          path: .sent
          key: btst-sent-${{ steps.d.outputs.day }}

      - uses: actions/setup-python@v5
        if: steps.sent.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.11"

      - name: Install
        if: steps.sent.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Run screener
        if: steps.sent.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python screener.py
          mkdir -p .sent && touch .sent/ok
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL: ${{ secrets.CAPITAL }}
          RISK_PCT: ${{ secrets.RISK_PCT }}
          MODE: BTST

      - name: Save signal log
        if: steps.sent.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add signals_log.csv || true
          git diff --cached --quiet || (git commit -m "Update signal log" && git pull --rebase && git push) || true
