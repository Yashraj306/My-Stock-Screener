name: Market Screener Automation

on:
  schedule:
    # 1. Pre-Market Scan: 9:00 AM IST (03:30 UTC) Mon-Fri
    - cron: '30 3 * * 1-5'
    
    # 2. BTST Scan: 2:00 PM IST (08:30 UTC) Mon-Fri
    - cron: '30 8 * * 1-5'

  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Choose Screener Mode'
        required: true
        default: 'BTST'
        type: choice
        options:
          - MORNING
          - BTST
          - SWING

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Screener Mode
        id: set-mode
        run: |
          # If triggered manually via workflow_dispatch, use user input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SELECTED_MODE=${{ github.event.inputs.scan_mode }}" >> $GITHUB_ENV
          else
            # For scheduled cron: 03:30 UTC is Morning, 08:30 UTC is BTST
            CURRENT_HOUR=$(date -u +%H)
            if [ "$CURRENT_HOUR" -lt "6" ]; then
              echo "SELECTED_MODE=MORNING" >> $GITHUB_ENV
            else
              echo "SELECTED_MODE=BTST" >> $GITHUB_ENV
            fi
          fi

      - name: Run Screener Engine
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ env.SELECTED_MODE }}
        run: |
          echo "Executing scan in MODE: $MODE"
          python screener.py

      - name: Commit Tracker Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add trades_tracker.json || true
          git commit -m "Auto-update trades tracker [skip ci]" || true
          git push || true
