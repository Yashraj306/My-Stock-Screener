
name: Market Screener Automation

on:
  schedule:
    # 9:00 AM IST = 03:30 UTC
    - cron: "30 3 * * 1-5"

    # 2:00 PM IST = 08:30 UTC
    - cron: "30 8 * * 1-5"

  workflow_dispatch:
    inputs:
      mode:
        description: "Select screener mode"
        required: true
        type: choice
        options:
          - MORNING
          - BTST
        default: MORNING

permissions:
  contents: read

concurrency:
  group: market-screener
  cancel-in-progress: false

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}

      MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '30 3 * * 1-5' && 'MORNING' || 'BTST') || inputs.mode || 'MORNING' }}

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Required Secrets
        run: |
          python - <<'PY'
          import os
          required = [
              "EMAIL_USER",
              "EMAIL_PASS",
              "EMAIL_TO",
              "UPSTOX_TOKEN"
          ]
          missing = [
              key for key in required
              if not os.getenv(key, "").strip()
          ]
          if missing:
              raise SystemExit(
                  "Missing GitHub Secrets: " + ", ".join(missing)
              )
          print("Required secrets are configured.")
          print("Screener mode:", os.getenv("MODE"))
          PY

      - name: Run Screener Engine
        run: |
          python screener.py

      - name: Workflow Summary
        if: always()
        run: |
          echo "## Market Screener Run" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: $MODE" >> $GITHUB_STEP_SUMMARY
          echo "- Scheduled timezone: IST (UTC+5:30)" >> $GITHUB_STEP_SUMMARY
          echo "- Execution: Signals only" >> $GITHUB_STEP_SUMMARY
          echo "- Automatic orders: Disabled" >> $GITHUB_STEP_SUMMARY
