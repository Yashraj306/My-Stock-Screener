name: Market Screener Automation

# Note: GitHub Actions cron schedules can be delayed by several minutes under heavy runner load.
on:
  schedule:
    - cron: "46 3 * * 1-5"   # 09:16 IST (MORNING gap WATCHLIST)
    - cron: "0 4 * * 1-5"    # 09:30 IST (MORNING 15-min ORB CONFIRMED)
    - cron: "30 8 * * 1-5"   # 14:00 IST (2 PM IST BTST)
  workflow_dispatch:
    inputs:
      mode:
        description: "Screener mode (MORNING or BTST)"
        required: false
        default: "BTST"

concurrency:
  group: market-screener-automation
  cancel-in-progress: false

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate Required Secrets
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python -c '
          import os
          tok = (os.getenv("UPSTOX_ACCESS_TOKEN") or os.getenv("UPSTOX_TOKEN") or "").strip()
          assert tok, "Missing UPSTOX_TOKEN / UPSTOX_ACCESS_TOKEN"
          for k in ("EMAIL_USER", "EMAIL_PASS", "EMAIL_TO"):
              assert (os.getenv(k) or "").strip(), f"Missing {k}"
          print("Secrets validated.")
          '

      - name: Run Unit Tests
        run: pytest -q

      - name: Run Screener Engine
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MODE: ${{ github.event.inputs.mode || 'BTST' }}
          PYTHONUNBUFFERED: "1"
        run: python screener.py

      - name: Commit Screener Snapshot and Logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: update screener snapshot & logs [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
